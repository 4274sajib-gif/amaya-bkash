<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Customer Account</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:#f5f6f8;
  font-family:Arial,sans-serif;
  color:#171717;
}

body{
  overflow-x:hidden;
}

button,input{
  font-family:inherit;
}

.app{
  width:100%;
  min-height:100vh;
}

.header{
  background:#111827;
  color:white;
  padding:20px 17px;
}

.header-title{
  font-size:21px;
  font-weight:700;
}

.header-sub{
  margin-top:4px;
  color:#cbd5e1;
  font-size:12px;
}

.container{
  width:100%;
  padding:15px;
}

.card{
  width:100%;
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.login-title{
  font-size:21px;
  font-weight:700;
  margin-bottom:6px;
}

.login-sub{
  font-size:13px;
  color:#777;
  margin-bottom:18px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:15px 0 7px;
  color:#444;
}

input{
  width:100%;
  height:52px;
  border:1px solid #d6d9df;
  border-radius:12px;
  padding:0 13px;
  font-size:16px;
  outline:none;
  background:white;
}

input:focus{
  border-color:#111827;
}

button{
  width:100%;
  height:52px;
  border:0;
  border-radius:12px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:700;
  margin-top:20px;
}

button:disabled{
  opacity:.55;
}

.notice{
  background:#fff8e6;
  border:1px solid #f5df9d;
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
}

.personal-notice{
  background:#fff1f2;
  border:1px solid #fecdd3;
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
}

.notice-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:6px;
}

.notice-text{
  font-size:14px;
  line-height:1.5;
  color:#555;
  white-space:pre-wrap;
}

.due-card{
  background:white;
  border-radius:20px;
  padding:21px 18px;
  margin-bottom:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.due-label{
  font-size:13px;
  color:#777;
  margin-bottom:7px;
}

.due-number{
  font-size:36px;
  line-height:1.1;
  font-weight:700;
}

.due-kd{
  font-size:15px;
  font-weight:400;
  color:#999;
}

.history-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:13px;
}

.transaction{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.045);
}

.transaction-date{
  font-size:16px;
  font-weight:700;
  margin-bottom:6px;
}

.transaction-main{
  font-size:17px;
  font-weight:400;
  line-height:1.35;
}

.transaction-kd{
  font-size:13px;
  color:#999;
}

.transaction-note{
  margin-top:5px;
  font-size:14px;
  color:#777;
  font-weight:400;
}

.logout{
  background:white;
  color:#555;
  border:1px solid #ddd;
  margin-top:8px;
}

.message{
  text-align:center;
  min-height:20px;
  margin-top:12px;
  font-size:14px;
}

.error{
  color:#dc2626;
}

.loading{
  color:#777;
}

.hidden{
  display:none !important;
}

.footer{
  text-align:center;
  padding:18px;
  font-size:12px;
  color:#999;
}

</style>

</head>

<body>

<div class="app">


<div class="header">

  <div class="header-title">
    Customer Account
  </div>

  <div class="header-sub">
    Your account & transaction history
  </div>

</div>


<!-- LOGIN -->

<div id="loginPage" class="container">

  <div class="card">

    <div class="login-title">
      Customer Login
    </div>

    <div class="login-sub">
      আপনার WhatsApp Number এবং Password দিয়ে Login করুন
    </div>

    <label>
      WhatsApp Number
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="tel"
      placeholder="WhatsApp Number"
      autocomplete="username"
    >

    <label>
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      onclick="login()">
      Login
    </button>

    <div
      id="loginMessage"
      class="message">
    </div>

  </div>

</div>


<!-- CUSTOMER -->

<div
id="customerPage"
class="container hidden">


  <div class="greeting">

    আসসালামু আলাইকুম,
    <span id="customerName"></span> 👋

  </div>


  <!-- GLOBAL NOTICE -->

  <div
  id="noticeBox"
  class="notice hidden">

    <div class="notice-title">
      📢 Notice
    </div>

    <div
    id="noticeText"
    class="notice-text">
    </div>

  </div>


  <!-- PERSONAL NOTICE -->

  <div
  id="personalNoticeBox"
  class="personal-notice hidden">

    <div class="notice-title">
      ⚠️ আপনার জন্য বার্তা
    </div>

    <div
    id="personalNoticeText"
    class="notice-text">
    </div>

  </div>


  <div class="due-card">

    <div class="due-label">
      বর্তমান বাকি
    </div>

    <div class="due-number">

      <span id="currentDue">
        0.000
      </span>

      <span class="due-kd">
        KD
      </span>

    </div>

  </div>


  <div class="history-title">
    লেনদেনের ইতিহাস
  </div>


  <div id="transactions">
  </div>


  <button
  class="logout"
  onclick="logout()">
    Logout
  </button>


</div>


<div class="footer">
  Customer Due System
</div>


</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec";


let currentCustomer = null;


/* LOGIN */

async function login(){

  const phone =
    document.getElementById("phone")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value
    .trim();

  const button =
    document.getElementById("loginButton");


  if(!phone || !password){

    showMessage(
      "loginMessage",
      "WhatsApp Number এবং Password দিন",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "Login হচ্ছে...";


  try{

    const url =
      API_URL +
      "?action=login" +
      "&phone=" +
      encodeURIComponent(phone) +
      "&password=" +
      encodeURIComponent(password);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if(data.success){

      currentCustomer =
        data.customer;


      localStorage.setItem(
        "customerSession",
        JSON.stringify(currentCustomer)
      );


      showCustomer();

    }else{

      showMessage(
        "loginMessage",
        data.message ||
        "Login করা যায়নি",
        "error"
      );

    }

  }catch(error){

    showMessage(
      "loginMessage",
      "Server-এর সাথে যোগাযোগ করা যাচ্ছে না",
      "error"
    );

  }


  button.disabled = false;

  button.textContent =
    "Login";
}


/* SHOW CUSTOMER */

function showCustomer(){

  document
    .getElementById("loginPage")
    .classList
    .add("hidden");


  document
    .getElementById("customerPage")
    .classList
    .remove("hidden");


  document
    .getElementById("customerName")
    .textContent =
    currentCustomer.name;


  loadNotice();

  loadPersonalNotice();

  loadTransactions();
}


/* GLOBAL NOTICE */

async function loadNotice(){

  try{

    const response =
      await fetch(
        API_URL +
        "?action=notice"
      );


    const data =
      await response.json();


    const box =
      document.getElementById("noticeBox");

    const text =
      document.getElementById("noticeText");


    if(
      data.notice &&
      String(data.notice).trim() !== ""
    ){

      text.textContent =
        data.notice;

      box.classList.remove("hidden");

    }else{

      box.classList.add("hidden");

    }

  }catch(error){

    console.log(error);

  }
}


/* PERSONAL NOTICE */

async function loadPersonalNotice(){

  const box =
    document.getElementById(
      "personalNoticeBox"
    );

  const text =
    document.getElementById(
      "personalNoticeText"
    );


  box.classList.add("hidden");


  if(
    !currentCustomer ||
    !currentCustomer.id
  ){

    return;
  }


  try{

    const response =
      await fetch(
        API_URL +
        "?action=personalNotice" +
        "&customerId=" +
        encodeURIComponent(
          currentCustomer.id
        )
      );


    const data =
      await response.json();


    if(
      data.notice &&
      String(data.notice).trim() !== ""
    ){

      text.textContent =
        data.notice;

      box.classList.remove(
        "hidden"
      );

    }else{

      box.classList.add(
        "hidden"
      );

    }

  }catch(error){

    box.classList.add(
      "hidden"
    );

  }
}


/* TRANSACTIONS */

async function loadTransactions(){

  const box =
    document.getElementById(
      "transactions"
    );


  box.innerHTML =
    '<div class="message loading">লেনদেন লোড হচ্ছে...</div>';


  try{

    const url =
      API_URL +
      "?action=transactions" +
      "&customerId=" +
      encodeURIComponent(
        currentCustomer.id
      );


    const response =
      await fetch(url);


    const data =
      await response.json();


    document
      .getElementById("currentDue")
      .textContent =
      Number(
        data.currentDue || 0
      ).toFixed(3);


    box.innerHTML = "";


    if(
      !data.transactions ||
      data.transactions.length === 0
    ){

      box.innerHTML =
        '<div class="message loading">কোনো লেনদেন পাওয়া যায়নি</div>';

      return;
    }


    data.transactions.forEach(
      function(t){

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "transaction";


        const sign =
          t.type === "বাকি"
          ? "+"
          : "−";


        let note =
          t.note || "";


        if(
          t.amountTk !== "" &&
          t.amountTk !== null &&
          t.amountTk !== undefined
        ){

          const tk =
            Number(
              t.amountTk
            ).toLocaleString(
              "en-US"
            );


          if(note){

            note +=
              " • " +
              tk +
              " Tk";

          }else{

            note =
              tk +
              " Tk";

          }

        }


        item.innerHTML = `

          <div class="transaction-date">
            ${escapeHTML(t.date)}
          </div>

          <div class="transaction-main">

            ${escapeHTML(t.type)}
            ${sign}${Number(t.amount).toFixed(3)}

            <span class="transaction-kd">
              KD
            </span>

          </div>

          ${
            note
            ?
            `
            <div class="transaction-note">
              ${escapeHTML(note)}
            </div>
            `
            :
            ""
          }

        `;


        box.appendChild(item);

      }
    );

  }catch(error){

    box.innerHTML =
      '<div class="message error">লেনদেন লোড হয়নি</div>';

  }
}


/* LOGOUT */

function logout(){

  localStorage.removeItem(
    "customerSession"
  );


  currentCustomer =
    null;


  document
    .getElementById("customerPage")
    .classList
    .add("hidden");


  document
    .getElementById("loginPage")
    .classList
    .remove("hidden");


  document
    .getElementById("phone")
    .value = "";


  document
    .getElementById("password")
    .value = "";

}


/* SAVED LOGIN */

function checkSavedLogin(){

  const saved =
    localStorage.getItem(
      "customerSession"
    );


  if(!saved){

    return;
  }


  try{

    currentCustomer =
      JSON.parse(saved);


    if(
      currentCustomer &&
      currentCustomer.id &&
      currentCustomer.name
    ){

      showCustomer();

    }

  }catch(error){

    localStorage.removeItem(
      "customerSession"
    );

  }
}


/* MESSAGE */

function showMessage(
  id,
  text,
  type
){

  const element =
    document.getElementById(id);


  element.textContent =
    text;


  element.className =
    "message " +
    (type || "");

}


/* HTML SAFE */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* START */

checkSavedLogin();

</script>

</body>

</html>
