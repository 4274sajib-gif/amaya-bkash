<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amaya Exchange</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6B4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%
}

body{
  background:#F0F4F8;
  color:#111827;
  font-family:Arial,sans-serif;
  overflow:hidden
}

button,input,select{
  font-family:inherit
}

.hidden{
  display:none!important
}

/* App */
.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden
}

/* =========================================================
   HEADER
========================================================= */
.header{
  flex-shrink:0;
  padding:8px 10px 4px;
  background:#F0F4F8
}

.header-inner{
  background:#F0F4F8;
  border-radius:16px;
  padding:14px 16px;
  box-shadow:
    8px 8px 20px rgba(163,177,198,.4),
    -8px -8px 20px rgba(255,255,255,.9)
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
  flex:1;
  min-width:0
}

.header-logo{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#F0F4F8;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  position:relative;
  box-shadow:
    3px 3px 8px rgba(163,177,198,.5),
    -3px -3px 8px rgba(255,255,255,.9),
    inset 0 1px 0 rgba(255,255,255,.5);
  overflow:hidden
}

.header-logo-inner{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,#0B6B4F 0%,#0F9D58 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.25),
    0 1px 3px rgba(11,107,79,.3)
}

.header-logo-currency{
  color:#FBBF24;
  font-size:22px;
  font-weight:900;
  line-height:1;
  text-shadow:
    0 1px 2px rgba(0,0,0,.3),
    0 0 8px rgba(251,191,36,.4)
}

.header-text{
  min-width:0;
  flex:1
}

.header-title{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:800;
  font-style:italic;
  font-size:18px;
  color:#0B6B4F;
  letter-spacing:-.3px;
  line-height:1.1;
  white-space:nowrap;
  text-shadow:
    -1px -1px 0 rgba(255,255,255,1),
    1px 1px 0 rgba(11,107,79,.25),
    2px 2px 0 rgba(11,107,79,.15)
}

.header-sub{
  margin-top:3px;
  color:#64748B;
  font-size:9px;
  font-weight:500;
  letter-spacing:.2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.header-actions{
  display:flex;
  gap:6px;
  flex-shrink:0
}

.header-button{
  height:32px;
  padding:0 11px;
  border:0;
  border-radius:9px;
  font-size:10px;
  font-weight:800;
  background:#F0F4F8;
  transition:all .15s ease;
  white-space:nowrap
}

.header-button.contact-button{
  color:#0B6B4F;
  box-shadow:
    2px 2px 6px rgba(163,177,198,.5),
    -2px -2px 6px rgba(255,255,255,.9)
}

.header-button.header-logout{
  color:#DC2626;
  box-shadow:
    2px 2px 6px rgba(163,177,198,.5),
    -2px -2px 6px rgba(255,255,255,.9)
}

.header-button:active{
  box-shadow:
    inset 2px 2px 4px rgba(163,177,198,.5),
    inset -2px -2px 4px rgba(255,255,255,.9)
}

.container{
  width:100%;
  padding:4px 9px 9px
}

#loginPage{
  flex:1;
  overflow-y:auto
}

.card{
  background:#fff;
  border-radius:15px;
  padding:17px;
  box-shadow:0 2px 10px rgba(0,0,0,.04)
}

.login-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:5px
}

.login-sub{
  font-size:13px;
  line-height:1.4;
  color:#777;
  margin-bottom:16px
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#374151;
  margin:12px 0 6px
}

input{
  width:100%;
  height:47px;
  border:1px solid #d8dce2;
  border-radius:10px;
  padding:0 12px;
  background:#fff;
  color:#111827;
  font-size:16px;
  outline:none
}

input:focus{
  border-color:#111827
}

button{
  width:100%;
  height:47px;
  border-radius:10px;
  background:#111827;
  color:#fff;
  font-size:15px;
  font-weight:700;
  margin-top:17px
}

button:disabled{
  opacity:.55
}

#customerPage{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden
}

.customer-filter-row{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:4px;
  width:100%;
  margin-bottom:5px
}

.filter-box{
  flex:.85;
  min-width:0;
  height:34px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:8px;
  padding:0 5px;
  color:#111827;
  font-size:9px;
  font-weight:700;
  outline:none;
  box-shadow:0 2px 5px rgba(0,0,0,.05)
}

.customer-name-card{
  flex:1.25;
  min-width:0;
  height:34px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:8px;
  padding:0 6px;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#111827;
  white-space:nowrap;
  overflow:hidden;
  box-shadow:0 2px 5px rgba(0,0,0,.05)
}

.customer-name-info{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-width:0;
  flex:1;
  overflow:hidden
}

#customerNameText{
  width:100%;
  font-size:13px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis
}

#customerPhone{
  width:100%;
  margin-top:1px;
  color:#64748b;
  font-size:9px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis
}

.refresh-inline{
  width:28px;
  height:28px;
  border-radius:7px;
  background:#F0F4F8;
  border:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#0B6B4F;
  cursor:pointer;
  box-shadow:
    2px 2px 5px rgba(163,177,198,.4),
    -2px -2px 5px rgba(255,255,255,.9);
  transition:all .15s ease;
  flex-shrink:0;
  margin-left:6px;
  margin-top:0;
  padding:0
}

.refresh-inline:hover{
  color:#16A34A
}

.refresh-inline:active{
  box-shadow:
    inset 2px 2px 4px rgba(163,177,198,.4),
    inset -2px -2px 4px rgba(255,255,255,.9)
}

.refresh-inline.spinning svg{
  animation:spin .8s linear infinite
}

.refresh-inline svg{
  width:13px;
  height:13px;
  stroke:currentColor;
  fill:none;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

.balance-rate-row{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  height:58px;
  margin-bottom:5px;
  padding:6px 10px;
  background:#F0F4F8;
  border:0;
  border-radius:12px;
  box-shadow:
    4px 4px 10px rgba(163,177,198,.5),
    -4px -4px 10px rgba(255,255,255,.9)
}

.balance-box{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
  padding:0;
  background:transparent
}

.warning-box{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  height:48px;
  padding:6px 10px;
  background:linear-gradient(135deg,#FFF7F7 0%,#F0FDF4 100%);
  border:1.5px solid #FEE2E2;
  border-left:4px solid #B91C1C;
  border-radius:10px;
  box-shadow:0 4px 12px rgba(22,163,74,.12)
}

.warning-icon{
  width:24px;
  height:24px;
  border-radius:50%;
  background:linear-gradient(135deg,#DC2626,#B91C1C);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  color:#fff;
  flex-shrink:0;
  font-weight:900;
  box-shadow:0 2px 6px rgba(220,38,38,.4);
  animation:pulseIcon 2s ease-in-out infinite
}

@keyframes pulseIcon{
  0%,100%{
    box-shadow:0 2px 6px rgba(220,38,38,.4), 0 0 0 0 rgba(220,38,38,.4)
  }
  50%{
    box-shadow:0 2px 6px rgba(220,38,38,.4), 0 0 0 6px rgba(220,38,38,0)
  }
}

.warning-content{
  display:flex;
  flex-direction:column;
  gap:1px;
  min-width:0;
  flex:1
}

.warning-label{
  color:#1E293B;
  font-size:7.5px;
  font-weight:800;
  letter-spacing:.5px;
  text-transform:uppercase;
  text-shadow:0 1px 0 rgba(255,255,255,.8);
  line-height:1
}

.warning-value{
  color:#B91C1C;
  font-size:16px;
  font-weight:900;
  letter-spacing:-.3px;
  display:flex;
  align-items:baseline;
  gap:3px;
  line-height:1
}

.warning-kd{
  color:#991B1B;
  font-size:9px;
  font-weight:700;
  margin-left:2px;
  letter-spacing:.3px
}

.rate-box{
  flex:1;
  min-width:0;
  height:100%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:0;
  background:transparent;
  border:0;
  box-shadow:none
}

.rate-input{
  width:100%;
  max-width:155px;
  height:32px;
  border:0;
  border-radius:16px;
  font-size:9px;
  font-weight:600;
  padding:0 10px;
  margin:0;
  background:#F0F4F8;
  color:#111827;
  outline:none;
  box-shadow:
    inset 2px 2px 4px rgba(163,177,198,.5),
    inset -2px -2px 4px rgba(255,255,255,.9)
}

.rate-input::placeholder{
  color:#94a3b8;
  font-weight:500
}

.rate-input:focus{
  background:#fff;
  box-shadow:
    0 0 0 3px rgba(15,157,88,.15),
    inset 2px 2px 4px rgba(163,177,198,.3),
    inset -2px -2px 4px rgba(255,255,255,.8)
}

.rate-popup{
  position:absolute;
  left:-5px;
  right:-5px;
  top:calc(100% + 6px);
  background:#111827;
  color:#fff;
  border-radius:10px;
  padding:7px 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  opacity:0;
  visibility:hidden;
  transform:translateY(8px);
  transition:
    opacity .18s ease,
    transform .18s ease,
    visibility .18s ease;
  box-shadow:0 5px 16px rgba(0,0,0,.18);
  z-index:50
}

.rate-popup.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0)
}

.rate-popup-left{
  min-width:0
}

.rate-popup-label{
  color:#aeb8c7;
  font-size:8px;
  line-height:1;
  margin-bottom:2px
}

.rate-popup-amount{
  font-size:13px;
  font-weight:700;
  white-space:nowrap
}

.rate-popup-right{
  text-align:right;
  flex-shrink:0
}

.rate-popup-kd{
  font-size:17px;
  font-weight:800;
  line-height:1;
  white-space:nowrap
}

.rate-popup::after{
  content:"";
  position:absolute;
  right:25%;
  top:-5px;
  width:10px;
  height:10px;
  background:#111827;
  transform:rotate(45deg)
}

.notice{
  flex-shrink:0;
  background:#fff9e9;
  border:1px solid #f3dfaa;
  border-radius:10px;
  padding:8px 10px;
  margin-bottom:8px
}

.notice-title{
  font-size:11px;
  font-weight:700;
  color:#5f4a10;
  margin-bottom:3px
}

.notice-text{
  font-size:12px;
  line-height:1.4;
  color:#625b46;
  white-space:pre-wrap
}

/* =========================================================
   TRANSACTIONS
========================================================= */
.transaction-history-header{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:2px 0 4px
}

.transaction-history-title{
  font-size:10px;
  font-weight:800;
  color:#64748b;
  margin:0
}

.select-mode-btn{
  height:26px;
  padding:0 11px;
  border:0;
  border-radius:8px;
  background:#F0F4F8;
  color:#0B6B4F;
  font-size:9.5px;
  font-weight:800;
  cursor:pointer;
  box-shadow:2px 2px 5px rgba(163,177,198,.4),-2px -2px 5px rgba(255,255,255,.9);
  transition:all .18s ease;
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:0;
  width:auto;
  line-height:1
}

.select-mode-btn::before{
  content:"☑";
  font-size:11px;
  line-height:1
}

.select-mode-btn:active{
  box-shadow:inset 2px 2px 4px rgba(163,177,198,.5),inset -2px -2px 4px rgba(255,255,255,.9)
}

.select-mode-btn.active{
  background:linear-gradient(135deg,#0B6B4F 0%,#0F9D58 100%);
  color:#fff;
  box-shadow:0 3px 10px rgba(11,107,79,.4),inset 0 1px 0 rgba(255,255,255,.2)
}

.select-mode-btn.active::before{
  content:"✓"
}

.transactions-scroll{
  flex:1;
  min-height:0;
  width:100%;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-bottom:90px
}

.transaction{
  position:relative;
  width:100%;
  background:#fff;
  border:1px solid #eef1f4;
  border-left:4px solid #16A34A;
  border-radius:12px;
  padding:10px 12px;
  margin-bottom:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.02);
  display:grid;
  grid-template-columns:auto 1px 1fr auto;
  gap:11px;
  align-items:center;
  transition:all .18s ease;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent
}

.transaction.paid-type{
  background:#FFF7F7;
  border-color:#FDE1E1;
  border-left-color:#DC2626
}

.transaction.cash-type{
  background:#F5F3FF;
  border-color:#E9D5FF;
  border-left-color:#7C3AED
}

body.select-mode-on .transaction{
  cursor:pointer;
}

body.select-mode-on .transaction:hover{
  transform:translateX(2px);
  box-shadow:0 3px 10px rgba(11,107,79,.12)
}

body.select-mode-on .transaction .select-check{
  display:flex;
}

body.select-mode-on .transaction .transaction-right{
  padding-right:26px;
}

.transaction.selected{
  border-left-color:#0B6B4F !important;
  background:#ECFDF5 !important;
  box-shadow:0 0 0 2px rgba(11,107,79,.35),0 4px 12px rgba(11,107,79,.18) !important;
  transform:scale(1.008)
}

.transaction .select-check{
  display:none;
  position:absolute;
  top:8px;
  right:8px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#F0F4F8;
  border:2px solid #cbd5e1;
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:transparent;
  font-weight:900;
  box-shadow:1px 1px 3px rgba(163,177,198,.4);
  transition:all .18s ease;
  z-index:2;
  line-height:1
}

.transaction.selected .select-check{
  background:#0B6B4F;
  border-color:#0B6B4F;
  color:#fff;
  box-shadow:0 2px 6px rgba(11,107,79,.45)
}

.transaction-date{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  line-height:1;
  min-width:56px;
  padding:2px 0;
  color:inherit;
  font-size:inherit;
  margin:0
}

.transaction-date .d{
  font-size:16px;
  font-weight:900;
  color:#166534;
  letter-spacing:-.3px;
  line-height:1;
  display:block
}

.transaction-date .m{
  font-size:9px;
  font-weight:800;
  color:#16A34A;
  letter-spacing:.5px;
  margin-top:3px;
  text-transform:uppercase;
  line-height:1;
  display:block
}

.transaction-date .y{
  font-size:7.5px;
  font-weight:800;
  color:#6B7280;
  letter-spacing:.4px;
  margin-top:2px;
  line-height:1;
  display:block
}

.transaction.paid-type .transaction-date .d{color:#B91C1C}
.transaction.paid-type .transaction-date .m{color:#DC2626}
.transaction.paid-type .transaction-date .y{color:#d08a8a}

.transaction.cash-type .transaction-date .d{color:#6D28D9}
.transaction.cash-type .transaction-date .m{color:#7C3AED}
.transaction.cash-type .transaction-date .y{color:#a78bfa}

.transaction-line{
  width:1px;
  height:36px;
  background:linear-gradient(
    180deg,
    transparent 0%,
    #e5e7eb 20%,
    #e5e7eb 80%,
    transparent 100%
  );
  align-self:center
}

.transaction-mid{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0
}

.transaction-amt{
  font-size:14px;
  font-weight:900;
  color:#166534;
  letter-spacing:-.2px;
  white-space:nowrap;
  line-height:1;
  display:block
}

.transaction.paid-type .transaction-amt{color:#DC2626}
.transaction.cash-type .transaction-amt{color:#7C3AED}

.transaction-note-text-full{
  font-size:10px;
  color:#6B7280;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:block
}

.transaction-pills-row{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:2px;
  align-items:center;
  max-width:100%
}

.balance-pill{
  font-size:9.5px;
  font-weight:800;
  border-radius:5px;
  padding:2px 6px;
  display:inline-block;
  line-height:1;
  letter-spacing:.1px;
  width:fit-content;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:100%
}
.balance-pill.due{
  background:#DCFCE7;
  color:#166534
}
.balance-pill.payment{
  background:#FEE2E2;
  color:#991B1B
}
.balance-pill.cash{
  background:#EDE9FE;
  color:#6D28D9
}

.desc-pill{
  font-size:9.5px;
  color:#374151;
  font-weight:800;
  background:#F3F4F6;
  border:1px solid #E5E7EB;
  border-radius:5px;
  padding:2px 6px;
  display:inline-block;
  line-height:1;
  width:fit-content;
  letter-spacing:.1px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:100%
}
.desc-pill:before{
  content:"👤 ";
  font-size:8.5px
}

.transaction-right{
  text-align:right;
  display:flex;
  flex-direction:column;
  gap:4px;
  align-items:flex-end;
  transition:padding-right .18s ease
}

.type-label{
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-size:9px;
  font-weight:800;
  white-space:nowrap
}

.type-label:before{
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  flex-shrink:0
}

.type-label.due{
  color:#166534
}
.type-label.due:before{
  background:#16A34A;
  box-shadow:0 0 0 2px rgba(22,163,74,.15)
}

.type-label.payment{
  color:#B91C1C
}
.type-label.payment:before{
  background:#DC2626;
  box-shadow:0 0 0 2px rgba(220,38,38,.15)
}

.type-label.cash{
  color:#7C3AED
}
.type-label.cash:before{
  background:#7C3AED;
  box-shadow:0 0 0 2px rgba(124,58,237,.15)
}

.premium-pin{

<script>

// ==================================================
// CONFIG
// ==================================================
const API_URL =
"https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec";

const CONTACT_WHATSAPP = "8801354304315";
const RATE_1 = 333.333333;
const RATE_2 = 363.636363;
const RATE_3 = 357.142857;
const REFRESH_TIME = 5000;

// ==================================================
// STATE
// ==================================================
let currentCustomer = null;
let refreshTimer = null;
let loadingTransactions = false;
let lastTransactionId = "";
let allTransactions = [];
let selectedTransactions = new Set();
let selectModeOn = false;

// ==================================================
// LOCAL CACHE
// ==================================================
const LOCAL_CACHE_PREFIX = "amayaExchangeCache_";
const LOCAL_CUSTOMER_KEY = "customerSession";

function getCacheKey() {
  if (!currentCustomer?.id) return null;
  return LOCAL_CACHE_PREFIX + String(currentCustomer.id);
}

function saveLocalData(data) {
  try {
    const key = getCacheKey();
    if (!key) return;
    localStorage.setItem(key, JSON.stringify({ savedAt: Date.now(), data: data }));
  } catch (error) {}
}

function getLocalData() {
  try {
    const key = getCacheKey();
    if (!key) return null;
    const saved = localStorage.getItem(key);
    if (!saved) return null;
    const parsed = JSON.parse(saved);
    if (!parsed || !parsed.data) return null;
    return parsed.data;
  } catch (error) { return null; }
}

// ==================================================
// FINGERPRINT
// ==================================================
function createTransactionFingerprint(transactions) {
  if (!Array.isArray(transactions)) return "";
  return JSON.stringify(transactions.map(t => ({
    transactionId: t.transactionId || "",
    date: t.date || "",
    kdAmount: t.kdAmount || "",
    bdAmount: t.bdAmount || "",
    type: t.type || "",
    note: t.note || "",
    description: t.description || "",
    agentOption: t.agentOption || ""
  })));
}

// ==================================================
// BANGLA NUMBER
// ==================================================
function toBn(num){
  const en = "0123456789";
  const bn = "০১২৩৪৫৬৭৮৯";
  return String(num).replace(/[0-9]/g, d => bn[en.indexOf(d)]);
}

// ==================================================
// DOM
// ==================================================
const $ = id => document.getElementById(id);

const loginPage = $("loginPage");
const customerPage = $("customerPage");
const phoneInput = $("phone");
const passwordInput = $("password");
const loginButton = $("loginButton");
const loginMessage = $("loginMessage");
const customerNameText = $("customerNameText");
const customerPhone = $("customerPhone");
const noticeBox = $("noticeBox");
const noticeText = $("noticeText");
const currentDue = $("currentDue");
const transactionsBox = $("transactions");
const rateAmount = $("rateAmount");
const ratePopup = $("ratePopup");
const ratePopupAmount = $("ratePopupAmount");
const ratePopupKD = $("ratePopupKD");
const yearFilter = $("yearFilter");
const monthFilter = $("monthFilter");
const headerLogout = $("headerLogout");
const refreshButton = $("refreshButton");
const selectModeBtn = $("selectModeBtn");

// ==================================================
// CONTACT
// ==================================================
function contactWhatsApp() {
  window.open("https://wa.me/" + CONTACT_WHATSAPP, "_blank");
}

// ==================================================
// NUMBER HELPERS
// ==================================================
function convertBanglaNumbers(value) {
  const bn = "০১২৩৪৫৬৭৮৯";
  const en = "0123456789";
  return String(value).replace(/[০-৯]/g, d => en[bn.indexOf(d)]);
}

function formatAmount(number) {
  return Number(number).toLocaleString("en-IN");
}

// ==================================================
// RATE
// ==================================================
function calculateRate() {
  let value = convertBanglaNumbers(rateAmount.value).replace(/[^0-9]/g, "");
  if (!value) { ratePopup.classList.remove("show"); return; }

  const amount = parseInt(value, 10);
  if (!Number.isFinite(amount) || amount <= 0) { ratePopup.classList.remove("show"); return; }

  let rate;
  if (amount < 1000) rate = RATE_1;
  else if (amount % 1000 === 0) rate = RATE_2;
  else rate = RATE_3;

  const kd = amount / rate;

  rateAmount.value = formatAmount(amount);
  ratePopupAmount.textContent = formatAmount(amount) + " Tk";
  ratePopupKD.textContent = kd.toFixed(3) + " KD";
  ratePopup.classList.add("show");
}

// ==================================================
// LOGIN
// ==================================================
async function login() {
  const phone = phoneInput.value.trim().replace(/\s+/g, "");
  const password = passwordInput.value.trim();

  if (!phone || !password) {
    showMessage("WhatsApp Number এবং Password দিন", "error");
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "Login হচ্ছে...";

  try {
    const url = API_URL + "?action=customerLogin" +
      "&phone=" + encodeURIComponent(phone) +
      "&password=" + encodeURIComponent(password);

    const response = await fetch(url);
    const data = await response.json();

    if (data.success) {
      currentCustomer = data.data?.customer || data.customer;
      if (!currentCustomer?.id) {
        showMessage("Customer তথ্য পাওয়া যায়নি", "error");
        return;
      }
      localStorage.setItem(LOCAL_CUSTOMER_KEY, JSON.stringify(currentCustomer));
      showCustomer();
    } else {
      showMessage(data.error || data.message || "Phone Number অথবা Password ভুল", "error");
    }
  } catch (error) {
    showMessage("Server-এর সাথে যোগাযোগ করা যাচ্ছে না", "error");
  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "Login";
  }
}

// ==================================================
// CUSTOMER
// ==================================================
function showCustomer() {
  loginPage.classList.add("hidden");
  customerPage.classList.remove("hidden");
  customerNameText.textContent = currentCustomer.name || "";
  customerPhone.textContent = currentCustomer.phone || "";
  headerLogout.classList.remove("hidden");
  loadLocalTransactions();
  loadNotice();
  loadTransactions(false);
  startAutoRefresh();
}

// ==================================================
// MANUAL REFRESH
// ==================================================
function refreshData(btn) {
  btn.classList.add("spinning");
  setTimeout(() => { location.reload(); }, 300);
}

// ==================================================
// SELECT MODE
// ==================================================
function toggleSelectMode() {
  if (selectModeOn) {
    exitSelectMode();
  } else {
    selectModeOn = true;
    document.body.classList.add("select-mode-on");
    selectModeBtn.classList.add("active");
    selectModeBtn.textContent = "Done";
    updateSelectPopup();
  }
}

function exitSelectMode() {
  selectModeOn = false;
  document.body.classList.remove("select-mode-on");
  selectModeBtn.classList.remove("active");
  selectModeBtn.textContent = "Select Mode";
  closeSelectMode();
}

// ==================================================
// ★ SELECT POPUP — FINAL
// ==================================================
function updateSelectPopup() {
  const popup = $("miniPopup");
  if (!popup) return;

  if (!selectModeOn || selectedTransactions.size === 0) {
    hideSelectPopup();
    return;
  }

  const calc = calcSelected();
  const mode = calc.allSame ? "confirm" : "warning";

  // Amount color
  const totalEl = $("popupTotal");
  totalEl.className = "popup-total " + mode;
  totalEl.innerHTML = (calc.totalKD < 0 ? '−' : '') + Math.abs(calc.totalKD).toFixed(3) + '<small>KD</small>';

  // Count
  $("popupCount").textContent = toBn(calc.count) + ' টি নির্বাচিত';

  // Icon dynamic
  const iconEl = $("popupIcon");
  iconEl.className = "popup-icon " + mode;
  iconEl.textContent = calc.allSame ? "✓" : "⚠️";

  // Badge
  const badgeEl = $("popupBadge");
  if (calc.allSame) {
    badgeEl.className = "popup-badge confirm";
    badgeEl.textContent = "✓ একই";
  } else {
    badgeEl.className = "popup-badge warning";
    badgeEl.textContent = "⚠️ " + toBn(calc.uniqueDescs.length) + " আলাদা";
  }

  // Status box
  renderPopupStatus(calc);

  popup.classList.add("show");
}

function calcSelected() {
  let totalKD = 0;
  const selectedTransactionsList = [];

  allTransactions.forEach(t => {
    const key = t.transactionId || JSON.stringify(t);
    if (!selectedTransactions.has(key)) return;

    const kd = Number(t.kdAmount || 0);
    const type = String(t.type || '').trim();

    if (type === 'পেমেন্ট') totalKD -= kd;
    else totalKD += kd;

    selectedTransactionsList.push(t);
  });

  const uniqueDescs = new Set(
    selectedTransactionsList.map(t => String(t.description || '').trim())
  );

  return {
    count: selectedTransactions.size,
    totalKD: totalKD,
    transactions: selectedTransactionsList,
    allSame: uniqueDescs.size === 1,
    uniqueDescs: Array.from(uniqueDescs)
  };
}

function renderPopupStatus(calc) {
  const el = $("popupStatus");
  if (!el) return;
  if (calc.transactions.length === 0) { el.innerHTML = ''; return; }

  if (calc.allSame) {
    const desc = calc.uniqueDescs[0] || '(No description)';
    el.innerHTML = `
      <div class="popup-status confirm">
        <div class="popup-status-icon">✓</div>
        <div class="popup-status-content">
          <div class="popup-status-title">সব একই ধরনের</div>
          <div class="popup-status-desc">
            সব লেনদেন: <b>${escapeHTML(desc)}</b>
            <br>${toBn(calc.count)} টি — নিরাপদে সম্পন্ন করুন
          </div>
        </div>
      </div>
    `;
  } else {
    const list = calc.uniqueDescs.map(d => `"${escapeHTML(d || 'No desc')}"`).join(', ');
    el.innerHTML = `
      <div class="popup-status warning">
        <div class="popup-status-icon">⚠️</div>
        <div class="popup-status-content">
          <div class="popup-status-title">সাবধান! আলাদা লেনদেন</div>
          <div class="popup-status-desc">
            ${toBn(calc.count)} টি লেনদেনে <b>${toBn(calc.uniqueDescs.length)} টি আলাদা নাম</b>:
            <br>${list}
          </div>
        </div>
      </div>
    `;
  }
}

function hideSelectPopup() {
  const popup = $("miniPopup");
  if (!popup) return;
  popup.classList.remove("show", "expanded");
  const ex = $("popupExpand");
  if (ex) ex.textContent = '▲';
}

function toggleSelectExpand(event) {
  const popup = $("miniPopup");
  if (!popup || !popup.classList.contains("show")) return;
  if (selectedTransactions.size === 0) return;
  const isExpanded = popup.classList.toggle("expanded");
  const ex = $("popupExpand");
  if (ex) ex.textContent = isExpanded ? '▼' : '▲';
}

function clearAllSelected() {
  selectedTransactions.clear();
  document.querySelectorAll(".transaction.selected").forEach(el => {
    el.classList.remove("selected");
  });
  hideSelectPopup();
}

function closeSelectMode() {
  selectedTransactions.clear();
  document.querySelectorAll(".transaction.selected").forEach(el => {
    el.classList.remove("selected");
  });
  hideSelectPopup();
}

// ==================================================
// LOCAL TRANSACTIONS
// ==================================================
function loadLocalTransactions() {
  if (!currentCustomer) return;
  const localData = getLocalData();
  if (!localData) return;

  const due = Number(localData.currentDue || 0);
  currentDue.textContent = due.toFixed(3);

  const transactions = localData.transactions || [];
  allTransactions = Array.isArray(transactions) ? transactions : [];

  if (!allTransactions.length) {
    transactionsBox.innerHTML = '<div class="message loading">কোনো লেনদেন পাওয়া যায়নি</div>';
    return;
  }

  lastTransactionId = createTransactionFingerprint(allTransactions);
  buildYearFilter(allTransactions);
  applyTransactionFilter();
}

// ==================================================
// AUTO REFRESH
// ==================================================
function startAutoRefresh() {
  stopAutoRefresh();
  refreshTimer = setInterval(() => {
    if (currentCustomer && !customerPage.classList.contains("hidden")) {
      loadTransactions(false);
    }
  }, REFRESH_TIME);
}

function stopAutoRefresh() {
  if (refreshTimer) {
    clearInterval(refreshTimer);
    refreshTimer = null;
  }
}

// ==================================================
// NOTICE
// ==================================================
async function loadNotice() {
  try {
    const response = await fetch(API_URL + "?action=notice", { cache: "no-store" });
    const data = await response.json();
    const notice = data.data?.notice ?? data.notice;
    if (notice && String(notice).trim() !== "") {
      noticeText.textContent = notice;
      noticeBox.classList.remove("hidden");
    } else {
      noticeBox.classList.add("hidden");
    }
  } catch (error) {}
}

// ==================================================
// LOAD TRANSACTIONS
// ==================================================
async function loadTransactions(firstLoad) {
  if (!currentCustomer || loadingTransactions) return;
  loadingTransactions = true;

  if (firstLoad && !getLocalData()) {
    transactionsBox.innerHTML = '<div class="message loading">লেনদেন লোড হচ্ছে...</div>';
  }

  try {
    const url = API_URL + "?action=transactions&customerId=" + encodeURIComponent(currentCustomer.id);
    const response = await fetch(url, { cache: "no-store" });
    const data = await response.json();

    if (!data.success) {
      if (firstLoad && !allTransactions.length) {
        transactionsBox.innerHTML = '<div class="message error">লেনদেন লোড হয়নি</div>';
      }
      return;
    }

    const result = data.data || {};
    const due = Number(result.currentDue || 0);
    const transactions = result.transactions || [];
    const cleanTransactions = Array.isArray(transactions) ? transactions : [];

    saveLocalData({ currentDue: due, transactions: cleanTransactions });

    const dueText = due.toFixed(3);
    if (currentDue.textContent !== dueText) {
      currentDue.textContent = dueText;
    }

    const newFingerprint = createTransactionFingerprint(cleanTransactions);
    const dataChanged = newFingerprint !== lastTransactionId;

    allTransactions = cleanTransactions;

    if (!allTransactions.length) {
      transactionsBox.innerHTML = '<div class="message loading">কোনো লেনদেন পাওয়া যায়নি</div>';
      lastTransactionId = newFingerprint;
      return;
    }

    if (firstLoad || dataChanged) {
      lastTransactionId = newFingerprint;
      buildYearFilter(allTransactions);
      applyTransactionFilter();
    }
  } catch (error) {
    if (firstLoad && !allTransactions.length) {
      transactionsBox.innerHTML = '<div class="message error">লেনদেন লোড হয়নি</div>';
    }
  } finally {
    loadingTransactions = false;
  }
}

// ==================================================
// YEAR FILTER
// ==================================================
function buildYearFilter(transactions) {
  const years = new Set();
  transactions.forEach(t => {
    const parsed = parseTransactionDate(t.date);
    if (parsed) years.add(parsed.getFullYear());
  });

  const sortedYears = Array.from(years).sort((a, b) => b - a);
  if (!sortedYears.length) return;

  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth();

  yearFilter.innerHTML = "";
  sortedYears.forEach(year => {
    const option = document.createElement("option");
    option.value = String(year);
    option.textContent = String(year);
    yearFilter.appendChild(option);
  });

  if (sortedYears.includes(currentYear)) {
    yearFilter.value = String(currentYear);
  } else {
    yearFilter.value = String(sortedYears[0]);
  }

  monthFilter.value = String(currentMonth);
}

// ==================================================
// DATE
// ==================================================
function parseTransactionDate(value) {
  if (!value) return null;

  const text = String(value).trim();
  const match = text.match(/^(\d{1,2})[-\/](Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[-\/](\d{4})$/i);

  if (match) {
    const day = parseInt(match[1], 10);
    const monthText = match[2].toLowerCase();
    const year = parseInt(match[3], 10);
    const months = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
    const month = months.indexOf(monthText);
    if (month >= 0) return new Date(year, month, day);
  }

  const fallback = new Date(text);
  return isNaN(fallback.getTime()) ? null : fallback;
}

// ==================================================
// FILTER
// ==================================================
function applyTransactionFilter() {
  if (!allTransactions.length) {
    transactionsBox.innerHTML = '<div class="message loading">কোনো লেনদেন পাওয়া যায়নি</div>';
    return;
  }

  const selectedYear = Number(yearFilter.value);
  const selectedMonth = monthFilter.value;

  let filtered;

  if (selectedMonth === "all") {
    filtered = allTransactions.filter(t => {
      const date = parseTransactionDate(t.date);
      return date && date.getFullYear() === selectedYear;
    });
  } else {
    const month = Number(selectedMonth);
    filtered = allTransactions.filter(t => {
      const date = parseTransactionDate(t.date);
      return date && date.getFullYear() === selectedYear && date.getMonth() === month;
    });
  }

  renderTransactions(filtered);
}

// ==================================================
// SELECTION
// ==================================================
function toggleSelection(transactionKey, element) {
  if (!selectModeOn) return;

  if (selectedTransactions.has(transactionKey)) {
    selectedTransactions.delete(transactionKey);
    element.classList.remove("selected");
  } else {
    selectedTransactions.add(transactionKey);
    element.classList.add("selected");
  }
  updateSelectPopup();
}

// ==================================================
// RENDER — Premium Cards
// ==================================================
function renderTransactions(transactions) {
  if (!transactions.length) {
    transactionsBox.innerHTML = '<div class="message loading">এই সময়ে কোনো লেনদেন পাওয়া যায়নি</div>';
    return;
  }

  const balanceMap = new Map();
  const chronological = [...allTransactions].sort((a, b) => {
    const da = parseTransactionDate(a.date);
    const db = parseTransactionDate(b.date);
    if (!da || !db) return 0;
    const diff = da.getTime() - db.getTime();
    if (diff !== 0) return diff;
    return String(a.transactionId || '').localeCompare(String(b.transactionId || ''));
  });

  let running = 0;
  chronological.forEach(t => {
    const kd = Number(t.kdAmount || 0);
    const type = String(t.type || '').trim();
    if (kd > 0) {
      if (type === 'বাকি') running += kd;
      else if (type === 'পেমেন্ট') running -= kd;
    }
    balanceMap.set(t.transactionId || JSON.stringify(t), Math.max(0, running));
  });

  const fragment = document.createDocumentFragment();

  for (const t of transactions) {
    const typeRaw = String(t.type || '').trim();
    const isDue = typeRaw === 'বাকি';
    const isPayment = typeRaw === 'পেমেন্ট';
    const isCash = typeRaw === 'নগদ';

    const item = document.createElement("div");

    if (isPayment) item.className = 'transaction paid-type';
    else if (isCash) item.className = 'transaction cash-type';
    else item.className = 'transaction due-type';

    const selectKey = t.transactionId || JSON.stringify(t);
    if (selectedTransactions.has(selectKey)) {
      item.classList.add("selected");
    }
    item.dataset.key = selectKey;

    const parsedDate = parseTransactionDate(t.date);
    let day = "", month = "", year = "";

    if (parsedDate) {
      day = String(parsedDate.getDate()).padStart(2, "0");
      month = parsedDate.toLocaleString("en-US", { month: "long" });
      year = String(parsedDate.getFullYear());
    } else {
      day = t.date || "";
    }

    const kdAmount = Number(t.kdAmount || 0);
    const sign = isPayment ? "−" : "+";
    const amtText = sign + kdAmount.toFixed(3) + " KD";

    let noteText = t.note || "";
const bdAmount = t.bdAmount;

// BD Amount শুধু নির্দিষ্ট note-এর জন্য দেখাবে
const allowedNotes = ["bkash", "nagad", "recharge", "electricity"];
const noteLower = String(t.note || "").toLowerCase();
const showBdAmount = allowedNotes.some(keyword => noteLower.includes(keyword));

if (showBdAmount && bdAmount !== "" && bdAmount !== null && bdAmount !== undefined && Number(bdAmount) !== 0) {
  const tk = Number(String(bdAmount).replace(/,/g, "")).toLocaleString("en-IN");
  noteText = noteText ? noteText + " • " + tk + " Tk" : tk + " Tk";
}

    const pinNumber = t.agentOption || "";
    const tKey = t.transactionId || JSON.stringify(t);
    const runningBal = balanceMap.get(tKey) || 0;
    const description = String(t.description || '').trim();

    const dateHTML =
      `<div class="transaction-date">` +
        `<span class="d">${escapeHTML(day)}</span>` +
        `<span class="m">${escapeHTML(month)}</span>` +
        `<span class="y">${escapeHTML(year)}</span>` +
      `</div>`;

    const lineHTML = `<div class="transaction-line"></div>`;

    const midHTML =
      `<div class="transaction-mid">` +
        `<span class="transaction-amt">${amtText}</span>` +
        (noteText ? `<span class="transaction-note-text-full">${escapeHTML(noteText)}</span>` : "") +
        `<div class="transaction-pills-row">` +
          `<span class="balance-pill ${isPayment?'payment':isCash?'cash':'due'}">বাকি ${runningBal.toFixed(3)}</span>` +
          (description ? `<span class="desc-pill">${escapeHTML(description)}</span>` : "") +
        `</div>` +
      `</div>`;

    let rightHTML = "";

    if (isDue && pinNumber) {
      rightHTML =
        `<div class="transaction-right">` +
          `<span class="premium-pin">` +
            `<span class="lbl">পিন</span>` +
            `<span class="dash">-</span>` +
            `<span class="num">${escapeHTML(pinNumber)}</span>` +
          `</span>` +
          `<span class="type-label due">বাকি</span>` +
        `</div>`;
    } else if (isDue) {
      rightHTML = `<div class="transaction-right"><span class="type-label due">বাকি</span></div>`;
    } else if (isPayment) {
      rightHTML = `<div class="transaction-right"><span class="type-label payment">পেমেন্ট</span></div>`;
    } else if (isCash && pinNumber) {
      rightHTML =
        `<div class="transaction-right">` +
          `<span class="premium-pin cash">` +
            `<span class="lbl">পিন</span>` +
            `<span class="dash">-</span>` +
            `<span class="num">${escapeHTML(pinNumber)}</span>` +
          `</span>` +
          `<span class="type-label cash">নগদ</span>` +
        `</div>`;
    } else if (isCash) {
      rightHTML = `<div class="transaction-right"><span class="type-label cash">নগদ</span></div>`;
    } else {
      rightHTML = `<div class="transaction-right"></div>`;
    }

    item.innerHTML =
      `<span class="select-check">✓</span>` +
      dateHTML + lineHTML + midHTML + rightHTML;

    item.addEventListener("click", () => {
      if (!selectModeOn) return;
      toggleSelection(selectKey, item);
    });

    fragment.appendChild(item);
  }

  transactionsBox.replaceChildren(fragment);
}

// ==================================================
// LOGOUT
// ==================================================
function logout() {
  stopAutoRefresh();
  localStorage.removeItem(LOCAL_CUSTOMER_KEY);

  currentCustomer = null;
  lastTransactionId = "";
  allTransactions = [];
  selectedTransactions.clear();
  selectModeOn = false;

  document.body.classList.remove("select-mode-on");
  if (selectModeBtn) {
    selectModeBtn.classList.remove("active");
    selectModeBtn.textContent = "Select Mode";
  }

  hideSelectPopup();

  customerPage.classList.add("hidden");
  loginPage.classList.remove("hidden");
  headerLogout.classList.add("hidden");

  phoneInput.value = "";
  passwordInput.value = "";
  rateAmount.value = "";
  ratePopup.classList.remove("show");
  loginMessage.textContent = "";
}

// ==================================================
// SESSION
// ==================================================
function checkSavedLogin() {
  const saved = localStorage.getItem(LOCAL_CUSTOMER_KEY);
  if (!saved) return;

  try {
    currentCustomer = JSON.parse(saved);
    if (currentCustomer && currentCustomer.id && currentCustomer.name) {
      showCustomer();
    }
  } catch (error) {
    localStorage.removeItem(LOCAL_CUSTOMER_KEY);
  }
}

// ==================================================
// MESSAGE
// ==================================================
function showMessage(text, type) {
  loginMessage.textContent = text;
  loginMessage.className = "message " + (type || "");
}

// ==================================================
// ESCAPE HTML
// ==================================================
function escapeHTML(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// ==================================================
// START
// ==================================================
checkSavedLogin();
