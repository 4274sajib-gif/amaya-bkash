<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amaya Exchange</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  min-height:100%;
}

body{
  background:#f4f6f8;
  color:#111827;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

button,input{font-family:inherit}

.hidden{display:none!important}

/* HEADER */
.header{
  background:#111827;
  color:#fff;
  padding:16px 14px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.header-title{
  font-size:18px;
  font-weight:700;
}

.header-sub{
  margin-top:3px;
  color:#cbd5e1;
  font-size:10px;
}

.contact-button{
  width:auto;
  height:33px;
  margin:0;
  padding:0 11px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:18px;
  background:#fff;
  color:#111827;
  font-size:11px;
  font-weight:700;
  box-shadow:0 2px 7px rgba(0,0,0,.15);
}

/* CONTAINER */
.container{
  width:100%;
  padding:11px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:17px;
  box-shadow:0 2px 10px rgba(0,0,0,.04);
}

/* LOGIN */
.login-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:5px;
}

.login-sub{
  font-size:13px;
  line-height:1.4;
  color:#777;
  margin-bottom:16px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#374151;
  margin:12px 0 6px;
}

input{
  width:100%;
  height:47px;
  border:1px solid #d8dce2;
  border-radius:10px;
  padding:0 12px;
  background:#fff;
  color:#111827;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#111827;
}

button{
  width:100%;
  height:47px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:#fff;
  font-size:15px;
  font-weight:700;
  margin-top:17px;
}

button:disabled{opacity:.55}

/* GREETING */
.greeting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  margin-bottom:11px;
}

.greeting-text{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:2px;
  min-width:0;
  color:#111827;
  font-size:15px;
  font-weight:600;
}

.customer-name{
  font-size:20px;
  font-weight:800;
}

/* TOP LOGOUT */
.logout-top{
  flex-shrink:0;
  width:auto;
  height:31px;
  margin:0;
  padding:0 10px;
  border:1px solid #dcdfe3;
  border-radius:9px;
  background:#fff;
  color:#555;
  font-size:11px;
  font-weight:700;
  box-shadow:none;
}

/* NOTICE */
.notice{
  background:#fff9e9;
  border:1px solid #f3dfaa;
  border-radius:12px;
  padding:11px 12px;
  margin-bottom:11px;
}

.notice-title{
  font-size:12px;
  font-weight:700;
  color:#5f4a10;
  margin-bottom:4px;
}

.notice-text{
  font-size:12px;
  line-height:1.45;
  color:#625b46;
  white-space:pre-wrap;
}

/* CURRENT DUE */
.due-card{
  width:100%;
  height:72px;
  background:#111827;
  border-radius:16px;
  padding:7px 10px;
  margin-bottom:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.due-label{
  color:#aeb8c7;
  font-size:11px;
  margin-bottom:3px;
}

.due-number{
  color:#fff;
  font-size:28px;
  line-height:1;
  font-weight:800;
  letter-spacing:-.5px;
}

.due-kd{
  color:#aeb8c7;
  font-size:11px;
  font-weight:500;
}

/* RATE */
.rate-box{
  background:#fff;
  border:1px solid #e9edf1;
  border-radius:13px;
  padding:10px;
  margin-bottom:13px;
}

.rate-input{
  height:46px;
  font-size:16px;
}

.rate-result{
  display:none;
  margin-top:8px;
  padding:9px 10px;
  background:#f4f6f8;
  border-radius:9px;
  text-align:center;
}

.rate-result-amount{
  color:#64748b;
  font-size:11px;
  margin-bottom:2px;
}

.rate-result-kd{
  color:#111827;
  font-size:21px;
  font-weight:800;
}

/* HISTORY */
.history-header{
  margin-bottom:7px;
}

.history-title{
  font-size:17px;
  font-weight:800;
}

.transactions-scroll{
  width:100%;
  max-height:52vh;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

/* TRANSACTION */
.transaction{
  position:relative;
  width:100%;
  background:#fff;
  border:1px solid #e9edf1;
  border-radius:11px;
  padding:7px 11px 6px;
  margin-bottom:3px;
  box-shadow:0 1px 3px rgba(0,0,0,.025);
}

.transaction-date{
  color:#9ca3af;
  font-size:9px;
  line-height:1.1;
  margin-bottom:2px;
  padding-right:55px;
}

.transaction-type{
  position:absolute;
  top:7px;
  right:11px;
  color:#111827;
  font-size:10px;
  font-weight:700;
}

.transaction-main{
  color:#111827;
  font-size:17px;
  line-height:1;
  font-weight:800;
}

.transaction-kd{
  font-size:9px;
  font-weight:700;
}

.transaction-note{
  color:#64748b;
  font-size:9px;
  line-height:1.15;
  margin-top:2px;
}

.transaction.due-type{
  border-left:3px solid #111827;
}

.transaction.paid-type{
  border-left:3px solid #94a3b8;
}

/* MESSAGE */
.message{
  width:100%;
  text-align:center;
  min-height:18px;
  margin-top:9px;
  font-size:12px;
}

.error{color:#dc2626}
.loading{color:#777}

/* FOOTER */
.footer{
  text-align:center;
  padding:13px 10px 15px;
  color:#9ca3af;
  font-size:10px;
}

/* SMALL PHONE */
@media(max-width:360px){

  .container{padding:9px}

  .header{
    padding:15px 12px;
  }

  .header-title{font-size:16px}
  .header-sub{font-size:9px}

  .contact-button{
    height:31px;
    padding:0 9px;
    font-size:10px;
  }

  .customer-name{font-size:19px}
  .greeting-text{font-size:14px}

  .logout-top{
    height:29px;
    padding:0 9px;
    font-size:10px;
  }

  .due-card{
    height:68px;
    border-radius:15px;
  }

  .due-number{font-size:26px}

  .rate-box{padding:9px}

  .rate-input{height:44px}

  .transaction{
    padding:6px 10px 5px;
    margin-bottom:3px;
  }

  .transaction-main{font-size:16px}
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->
<div class="header">
  <div class="header-row">

    <div>
      <div class="header-title">Amaya Exchange</div>
      <div class="header-sub">লেনদেনে আস্থা, সেবায় নির্ভরতা</div>
    </div>

    <button
      class="contact-button"
      onclick="contactWhatsApp()">
      📞 Contact Us
    </button>

  </div>
</div>


<!-- LOGIN -->
<div id="loginPage" class="container">

  <div class="card">

    <div class="login-title">Customer Login</div>

    <div class="login-sub">
      আপনার WhatsApp Number এবং Password দিয়ে Login করুন
    </div>

    <label>WhatsApp Number</label>

    <input
      id="phone"
      type="tel"
      inputmode="tel"
      placeholder="WhatsApp Number"
      autocomplete="username"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton" onclick="login()">
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </div>
</div>


<!-- CUSTOMER -->
<div id="customerPage" class="container hidden">

  <!-- GREETING + LOGOUT -->
  <div class="greeting">

    <div class="greeting-text">

      <span>আসসালামু আলাইকুম,</span>

      <span
        id="customerName"
        class="customer-name">
      </span>

      <span>👋</span>

    </div>

    <button
      class="logout-top"
      onclick="logout()">
      Logout
    </button>

  </div>


  <!-- NOTICE -->
  <div id="noticeBox" class="notice hidden">

    <div class="notice-title">
      📢 Notice
    </div>

    <div
      id="noticeText"
      class="notice-text">
    </div>

  </div>


  <!-- CURRENT DUE -->
  <div class="due-card">

    <div class="due-label">
      বর্তমান বাকি
    </div>

    <div class="due-number">

      <span id="currentDue">
        0.000
      </span>

      <span class="due-kd">
        KD
      </span>

    </div>

  </div>


  <!-- RATE -->
  <div class="rate-box">

    <input
      id="rateAmount"
      class="rate-input"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="💱 রেট জানতে এখানে টাকার পরিমান লিখুন"
      oninput="calculateRate()"
    >

    <div
      id="rateResult"
      class="rate-result">

      <div
        id="rateResultAmount"
        class="rate-result-amount">
      </div>

      <div
        id="rateResultKD"
        class="rate-result-kd">
      </div>

    </div>

  </div>


  <!-- HISTORY -->
  <div class="history-header">
    <div class="history-title">
      Transaction History
    </div>
  </div>

  <div
    id="transactions"
    class="transactions-scroll">
  </div>

</div>


<!-- FOOTER -->
<div class="footer">
  Amaya Exchange
</div>

</div>


<script>

const API_URL="https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec";

const CONTACT_WHATSAPP="8801354304315";

const RATE_1=333.333333;
const RATE_2=363.636363;
const RATE_3=357.142857;

let currentCustomer=null;


/* CONTACT */
function contactWhatsApp(){
  window.open(
    "https://wa.me/"+CONTACT_WHATSAPP,
    "_blank"
  );
}


/* BANGLA NUMBER */
function convertBanglaNumbers(value){

  const b="০১২৩৪৫৬৭৮৯";
  const e="0123456789";

  return String(value).replace(
    /[০-৯]/g,
    d=>e[b.indexOf(d)]
  );
}


/* FORMAT */
function formatAmount(number){
  return Number(number).toLocaleString("en-US");
}


/* RATE */
function calculateRate(){

  const input=document.getElementById("rateAmount");
  const result=document.getElementById("rateResult");

  let value=convertBanglaNumbers(input.value)
    .replace(/[^0-9]/g,"");

  if(!value){
    result.style.display="none";
    return;
  }

  const amount=parseInt(value,10);

  if(!Number.isFinite(amount)||amount<=0){
    result.style.display="none";
    return;
  }

  let rate;

  if(amount<1000){
    rate=RATE_1;
  }
  else if(amount%1000===0){
    rate=RATE_2;
  }
  else{
    rate=RATE_3;
  }

  const kd=amount/rate;

  input.value=formatAmount(amount);

  result.style.display="block";

  document.getElementById("rateResultAmount")
    .textContent=formatAmount(amount)+" Tk";

  document.getElementById("rateResultKD")
    .textContent=kd.toFixed(3)+" KD";
}


/* LOGIN */
async function login(){

  const phone=document
    .getElementById("phone")
    .value.trim();

  const password=document
    .getElementById("password")
    .value.trim();

  const button=document
    .getElementById("loginButton");

  if(!phone||!password){

    showMessage(
      "loginMessage",
      "WhatsApp Number এবং Password দিন",
      "error"
    );

    return;
  }

  button.disabled=true;
  button.textContent="Login হচ্ছে...";

  try{

    const url=
      API_URL+
      "?action=login&phone="+
      encodeURIComponent(phone)+
      "&password="+
      encodeURIComponent(password);

    const response=await fetch(url);
    const data=await response.json();

    if(data.success){

      currentCustomer=data.customer;

      localStorage.setItem(
        "customerSession",
        JSON.stringify(currentCustomer)
      );

      showCustomer();

    }else{

      showMessage(
        "loginMessage",
        data.message||"Login করা যায়নি",
        "error"
      );
    }

  }catch(error){

    showMessage(
      "loginMessage",
      "Server-এর সাথে যোগাযোগ করা যাচ্ছে না",
      "error"
    );

  }

  button.disabled=false;
  button.textContent="Login";
}


/* SHOW CUSTOMER */
function showCustomer(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("customerPage")
    .classList.remove("hidden");

  document
    .getElementById("customerName")
    .textContent=currentCustomer.name;

  loadNotice();
  loadTransactions();
}


/* NOTICE */
async function loadNotice(){

  try{

    const response=
      await fetch(API_URL+"?action=notice");

    const data=
      await response.json();

    const box=
      document.getElementById("noticeBox");

    const text=
      document.getElementById("noticeText");

    if(
      data.notice &&
      String(data.notice).trim()!==""
    ){

      text.textContent=data.notice;
      box.classList.remove("hidden");

    }else{

      box.classList.add("hidden");

    }

  }catch(error){}
}


/* TRANSACTIONS */
async function loadTransactions(){

  const box=
    document.getElementById("transactions");

  box.innerHTML=
    '<div class="message loading">লেনদেন লোড হচ্ছে...</div>';

  try{

    const url=
      API_URL+
      "?action=transactions&customerId="+
      encodeURIComponent(currentCustomer.id);

    const response=await fetch(url);
    const data=await response.json();

    document.getElementById("currentDue")
      .textContent=
      Number(data.currentDue||0).toFixed(3);

    box.innerHTML="";

    if(
      !data.transactions||
      !data.transactions.length
    ){

      box.innerHTML=
        '<div class="message loading">কোনো লেনদেন পাওয়া যায়নি</div>';

      return;
    }

    data.transactions.forEach(t=>{

      const item=
        document.createElement("div");

      item.className=
        t.type==="বাকি"
        ?"transaction due-type"
        :"transaction paid-type";

      const sign=
        t.type==="বাকি"
        ?"+"
        :"−";

      let note=t.note||"";

      if(
        t.amountTk!=="" &&
        t.amountTk!==null &&
        t.amountTk!==undefined
      ){

        const tk=
          Number(t.amountTk)
          .toLocaleString("en-US");

        note=
          note
          ?note+" • "+tk+" Tk"
          :tk+" Tk";
      }

      item.innerHTML=`

        <div class="transaction-date">
          ${escapeHTML(t.date)}
        </div>

        <div class="transaction-type">
          ${escapeHTML(t.type)}
        </div>

        <div class="transaction-main">
          ${sign}${Number(t.amount).toFixed(3)}
          <span class="transaction-kd">KD</span>
        </div>

        ${
          note
          ?`<div class="transaction-note">
              ${escapeHTML(note)}
            </div>`
          :""
        }

      `;

      box.appendChild(item);

    });

  }catch(error){

    box.innerHTML=
      '<div class="message error">লেনদেন লোড হয়নি</div>';

  }
}


/* LOGOUT */
function logout(){

  localStorage.removeItem("customerSession");

  currentCustomer=null;

  document
    .getElementById("customerPage")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("phone").value="";
  document.getElementById("password").value="";
  document.getElementById("rateAmount").value="";
  document.getElementById("rateResult").style.display="none";
}


/* SAVED LOGIN */
function checkSavedLogin(){

  const saved=
    localStorage.getItem("customerSession");

  if(!saved)return;

  try{

    currentCustomer=JSON.parse(saved);

    if(
      currentCustomer &&
      currentCustomer.id &&
      currentCustomer.name
    ){

      showCustomer();
    }

  }catch(error){

    localStorage.removeItem("customerSession");

  }
}


/* MESSAGE */
function showMessage(id,text,type){

  const element=
    document.getElementById(id);

  element.textContent=text;
  element.className=
    "message "+(type||"");
}


/* ESCAPE */
function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* START */
checkSavedLogin();

</script>

</body>
</html>
