<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Customer Account</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#f5f6f8;
  font-family:Arial,sans-serif;
  color:#111827;
}

body{
  overflow-x:hidden;
}

button,
input{
  font-family:inherit;
}

.app{
  width:100%;
  min-height:100vh;
}


/* ==============================
   HEADER
============================== */

.header{
  background:#111827;
  color:white;
  padding:15px 14px;
}

.header-title{
  font-size:17px;
  font-weight:700;
}

.header-sub{
  margin-top:2px;
  color:#cbd5e1;
  font-size:10px;
}


/* ==============================
   CONTAINER
============================== */

.container{
  width:100%;
  padding:10px;
}


/* ==============================
   LOGIN CARD
============================== */

.card{
  width:100%;
  background:white;
  border-radius:15px;
  padding:16px;
  margin-bottom:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.login-title{
  font-size:19px;
  font-weight:700;
  margin-bottom:4px;
}

.login-sub{
  font-size:12px;
  color:#777;
  margin-bottom:14px;
}


/* ==============================
   INPUT
============================== */

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin:12px 0 5px;
  color:#444;
}

input{
  width:100%;
  height:46px;
  border:1px solid #d6d9df;
  border-radius:10px;
  padding:0 11px;
  font-size:15px;
  outline:none;
  background:white;
}

input:focus{
  border-color:#111827;
}


/* ==============================
   BUTTON
============================== */

button{
  width:100%;
  height:46px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  font-size:14px;
  font-weight:700;
  margin-top:16px;
}

button:disabled{
  opacity:.55;
}


/* ==============================
   NOTICE
============================== */

.notice{
  background:#fff8e6;
  border:1px solid #f5df9d;
  border-radius:12px;
  padding:11px;
  margin-bottom:10px;
}

.notice-title{
  font-size:12px;
  font-weight:700;
  margin-bottom:4px;
}

.notice-text{
  font-size:12px;
  line-height:1.4;
  color:#555;
  white-space:pre-wrap;
}


/* ==============================
   GREETING
============================== */

.greeting{
  font-size:14px;
  font-weight:600;
  color:#111827;
  margin-bottom:10px;
}

.customer-name{
  font-size:19px;
  font-weight:800;
  margin-left:3px;
}


/* ==============================
   CURRENT DUE CARD
============================== */

.due-card{
  background:#111827;
  border-radius:18px;
  padding:14px 10px;
  margin-bottom:14px;

  box-shadow:0 4px 12px rgba(0,0,0,.08);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  min-height:88px;
}

.due-label{
  font-size:11px;
  font-weight:500;
  color:#aeb8c7;
  margin-bottom:3px;
}

.due-number{
  font-size:31px;
  line-height:1;
  font-weight:800;
  color:#ffffff;
  letter-spacing:-.4px;
}

.due-kd{
  font-size:12px;
  font-weight:500;
  color:#aeb8c7;
  margin-left:2px;
}


/* ==============================
   HISTORY TITLE
============================== */

.history-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:7px;
  color:#111827;
}


/* ==============================
   TRANSACTION CARD
============================== */

.transaction{
  position:relative;

  background:#ffffff;

  border:1px solid #edf0f4;

  border-radius:13px;

  padding:10px 12px;

  margin-bottom:5px;

  box-shadow:0 1px 4px rgba(0,0,0,.025);
}


/* DATE */

.transaction-date{
  font-size:10px;
  font-weight:400;
  color:#9ca3af;
  margin-bottom:4px;
}


/* TYPE */

.transaction-type{
  position:absolute;

  top:10px;
  right:12px;

  font-size:11px;

  font-weight:700;

  color:#111827;
}


/* AMOUNT */

.transaction-main{
  font-size:19px;

  font-weight:800;

  line-height:1;

  color:#111827;
}


/* KD */

.transaction-kd{
  font-size:11px;

  font-weight:700;

  color:#111827;
}


/* NOTE */

.transaction-note{
  margin-top:4px;

  font-size:11px;

  color:#64748b;

  font-weight:400;

  line-height:1.15;
}


/* ==============================
   LOGOUT
============================== */

.logout{
  background:white;

  color:#555;

  border:1px solid #ddd;

  margin-top:7px;

  margin-bottom:7px;

  height:43px;

  font-size:13px;
}


/* ==============================
   MESSAGE
============================== */

.message{
  text-align:center;

  min-height:16px;

  margin-top:8px;

  font-size:12px;
}

.error{
  color:#dc2626;
}

.loading{
  color:#777;
}


/* ==============================
   HIDDEN
============================== */

.hidden{
  display:none !important;
}


/* ==============================
   FOOTER
============================== */

.footer{
  text-align:center;

  padding:12px;

  font-size:10px;

  color:#999;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:480px){

  .container{
    padding:10px;
  }

  .greeting{
    font-size:14px;
    margin-bottom:10px;
  }

  .customer-name{
    font-size:19px;
  }

  .due-card{
    min-height:88px;
    padding:14px 10px;
    border-radius:18px;
    margin-bottom:14px;
  }

  .due-label{
    font-size:11px;
  }

  .due-number{
    font-size:31px;
  }

  .due-kd{
    font-size:12px;
  }

  .history-title{
    font-size:16px;
    margin-bottom:7px;
  }

  .transaction{
    padding:10px 12px;
    border-radius:13px;
    margin-bottom:5px;
  }

  .transaction-date{
    font-size:10px;
    margin-bottom:4px;
  }

  .transaction-type{
    top:10px;
    right:12px;
    font-size:11px;
  }

  .transaction-main{
    font-size:19px;
  }

  .transaction-kd{
    font-size:11px;
  }

  .transaction-note{
    font-size:11px;
    margin-top:4px;
  }

}


/* ==============================
   SMALL PHONE
============================== */

@media(max-width:360px){

  .container{
    padding:8px;
  }

  .greeting{
    font-size:13px;
  }

  .customer-name{
    font-size:18px;
  }

  .due-card{
    min-height:84px;
    padding:13px 9px;
  }

  .due-number{
    font-size:29px;
  }

  .history-title{
    font-size:15px;
  }

  .transaction{
    padding:9px 11px;
    border-radius:12px;
    margin-bottom:4px;
  }

  .transaction-date{
    font-size:9px;
  }

  .transaction-type{
    top:9px;
    right:11px;
    font-size:10px;
  }

  .transaction-main{
    font-size:18px;
  }

  .transaction-kd{
    font-size:10px;
  }

  .transaction-note{
    font-size:10px;
  }

}

</style>

</head>


<body>

<div class="app">


<!-- ==============================
     HEADER
============================== -->

<div class="header">

  <div class="header-title">
    Customer Account
  </div>

  <div class="header-sub">
    Your account & transaction history
  </div>

</div>


<!-- ==============================
     LOGIN PAGE
============================== -->

<div id="loginPage" class="container">

  <div class="card">

    <div class="login-title">
      Customer Login
    </div>

    <div class="login-sub">
      আপনার WhatsApp Number এবং Password দিয়ে Login করুন
    </div>


    <label>
      WhatsApp Number
    </label>

    <input
      id="phone"
      type="tel"
      inputmode="tel"
      placeholder="WhatsApp Number"
      autocomplete="username"
    >


    <label>
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button
      id="loginButton"
      onclick="login()">

      Login

    </button>


    <div
      id="loginMessage"
      class="message">

    </div>

  </div>

</div>


<!-- ==============================
     CUSTOMER PAGE
============================== -->

<div
  id="customerPage"
  class="container hidden">


  <!-- GREETING -->

  <div class="greeting">

    আসসালামু আলাইকুম,
    <span id="customerName" class="customer-name"></span> 👋

  </div>


  <!-- GLOBAL NOTICE -->

  <div
    id="noticeBox"
    class="notice hidden">

    <div class="notice-title">
      📢 Notice
    </div>

    <div
      id="noticeText"
      class="notice-text">

    </div>

  </div>


  <!-- CURRENT DUE -->

  <div class="due-card">

    <div class="due-label">
      বর্তমান বাকি
    </div>

    <div class="due-number">

      <span id="currentDue">
        0.000
      </span>

      <span class="due-kd">
        KD
      </span>

    </div>

  </div>


  <!-- TRANSACTION HISTORY -->

  <div class="history-title">
    Transaction History
  </div>


  <div id="transactions"></div>


  <!-- LOGOUT -->

  <button
    class="logout"
    onclick="logout()">

    Logout

  </button>


</div>


<!-- FOOTER -->

<div class="footer">
  Customer Due System
</div>


</div>



<script>


/* ==============================
   API
============================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec";


let currentCustomer = null;


/* ==============================
   LOGIN
============================== */

async function login(){

  const phone =
    document
      .getElementById("phone")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value
      .trim();


  const button =
    document.getElementById(
      "loginButton"
    );


  if(!phone || !password){

    showMessage(
      "loginMessage",
      "WhatsApp Number এবং Password দিন",
      "error"
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "Login হচ্ছে...";


  try{

    const url =
      API_URL +
      "?action=login" +
      "&phone=" +
      encodeURIComponent(phone) +
      "&password=" +
      encodeURIComponent(password);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if(data.success){

      currentCustomer =
        data.customer;


      localStorage.setItem(
        "customerSession",
        JSON.stringify(
          currentCustomer
        )
      );


      showCustomer();

    }else{

      showMessage(
        "loginMessage",
        data.message ||
        "Login করা যায়নি",
        "error"
      );

    }

  }catch(error){

    showMessage(
      "loginMessage",
      "Server-এর সাথে যোগাযোগ করা যাচ্ছে না",
      "error"
    );

  }


  button.disabled = false;

  button.textContent =
    "Login";

}


/* ==============================
   SHOW CUSTOMER
============================== */

function showCustomer(){

  document
    .getElementById(
      "loginPage"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "customerPage"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "customerName"
    )
    .textContent =
    currentCustomer.name;


  loadNotice();

  loadTransactions();

}


/* ==============================
   GLOBAL NOTICE
============================== */

async function loadNotice(){

  try{

    const response =
      await fetch(
        API_URL +
        "?action=notice"
      );


    const data =
      await response.json();


    const box =
      document.getElementById(
        "noticeBox"
      );


    const text =
      document.getElementById(
        "noticeText"
      );


    if(
      data.notice &&
      String(
        data.notice
      ).trim() !== ""
    ){

      text.textContent =
        data.notice;


      box.classList.remove(
        "hidden"
      );

    }else{

      box.classList.add(
        "hidden"
      );

    }

  }catch(error){

    console.log(error);

  }

}


/* ==============================
   TRANSACTIONS
============================== */

async function loadTransactions(){

  const box =
    document.getElementById(
      "transactions"
    );


  box.innerHTML =
    '<div class="message loading">লেনদেন লোড হচ্ছে...</div>';


  try{

    const url =
      API_URL +
      "?action=transactions" +
      "&customerId=" +
      encodeURIComponent(
        currentCustomer.id
      );


    const response =
      await fetch(url);


    const data =
      await response.json();


    /* CURRENT DUE */

    document
      .getElementById(
        "currentDue"
      )
      .textContent =
      Number(
        data.currentDue || 0
      ).toFixed(3);


    box.innerHTML = "";


    /* NO TRANSACTION */

    if(
      !data.transactions ||
      data.transactions.length === 0
    ){

      box.innerHTML =
        '<div class="message loading">কোনো লেনদেন পাওয়া যায়নি</div>';

      return;

    }


    /* TRANSACTION LOOP */

    data.transactions.forEach(
      function(t){

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "transaction";


        /* SIGN */

        const sign =
          t.type === "বাকি"
          ? "+"
          : "−";


        /* NOTE */

        let note =
          t.note || "";


        /* TK AMOUNT */

        if(
          t.amountTk !== "" &&
          t.amountTk !== null &&
          t.amountTk !== undefined
        ){

          const tk =
            Number(
              t.amountTk
            ).toLocaleString(
              "en-US"
            );


          if(note){

            note +=
              " • " +
              tk +
              " Tk";

          }else{

            note =
              tk +
              " Tk";

          }

        }


        /* TRANSACTION HTML */

        item.innerHTML = `

          <div class="transaction-date">
            ${escapeHTML(t.date)}
          </div>


          <div class="transaction-type">
            ${escapeHTML(t.type)}
          </div>


          <div class="transaction-main">

            ${sign}${Number(
              t.amount
            ).toFixed(3)}

            <span class="transaction-kd">
              KD
            </span>

          </div>


          ${
            note
            ?
            `
            <div class="transaction-note">
              ${escapeHTML(note)}
            </div>
            `
            :
            ""
          }

        `;


        box.appendChild(
          item
        );

      }
    );

  }catch(error){

    box.innerHTML =
      '<div class="message error">লেনদেন লোড হয়নি</div>';

  }

}


/* ==============================
   LOGOUT
============================== */

function logout(){

  localStorage.removeItem(
    "customerSession"
  );


  currentCustomer =
    null;


  document
    .getElementById(
      "customerPage"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "loginPage"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "phone"
    )
    .value = "";


  document
    .getElementById(
      "password"
    )
    .value = "";

}


/* ==============================
   SAVED LOGIN
============================== */

function checkSavedLogin(){

  const saved =
    localStorage.getItem(
      "customerSession"
    );


  if(!saved){

    return;

  }


  try{

    currentCustomer =
      JSON.parse(saved);


    if(
      currentCustomer &&
      currentCustomer.id &&
      currentCustomer.name
    ){

      showCustomer();

    }

  }catch(error){

    localStorage.removeItem(
      "customerSession"
    );

  }

}


/* ==============================
   MESSAGE
============================== */

function showMessage(
  id,
  text,
  type
){

  const element =
    document.getElementById(
      id
    );


  element.textContent =
    text;


  element.className =
    "message " +
    (type || "");

}


/* ==============================
   HTML SAFE
============================== */

function escapeHTML(text){

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==============================
   START
============================== */

checkSavedLogin();

</script>

</body>

</html>
