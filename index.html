<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amaya Exchange</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6B4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
/* Global */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  background:#f4f6f8;
  color:#111827;
  font-family:Arial,sans-serif;
  overflow:hidden
}
button,input,select{font-family:inherit}
.hidden{display:none!important}

/* App */
.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden
}

/* Header */
.header{
  flex-shrink:0;
  background:#111827;
  color:#fff;
  padding:12px
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}
.header-left{
  min-width:0;
  flex:1
}
.header-title{
  font-size:18px;
  font-weight:700;
  white-space:nowrap
}
.header-sub{
  margin-top:3px;
  color:#cbd5e1;
  font-size:10px
}
.header-actions{
  display:flex;
  align-items:center;
  gap:5px;
  flex-shrink:0
}
.header-button{
  width:auto;
  height:31px;
  margin:0;
  padding:0 9px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:16px;
  background:#fff;
  color:#111827;
  font-size:10px;
  font-weight:700;
  box-shadow:0 2px 6px rgba(0,0,0,.12)
}
.contact-button{
  background:#f8fafc;
  color:#111827;
  border:1px solid #e2e8f0;
  box-shadow:0 3px 0 #cbd5e1,0 5px 10px rgba(0,0,0,.2);
  transition:all .15s ease
}
.contact-button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #cbd5e1,0 3px 6px rgba(0,0,0,.15)
}
.header-logout{
  background:#fff1f2;
  color:#dc2626;
  border:1px solid #fecdd3;
  box-shadow:0 3px 0 #fecdd3,0 5px 10px rgba(220,38,38,.15);
  transition:all .15s ease
}
.header-logout:active{
  transform:translateY(2px);
  background:#ffe4e6;
  box-shadow:0 1px 0 #fecdd3,0 3px 6px rgba(220,38,38,.12)
}

/* Container */
.container{
  width:100%;
  padding:9px
}

/* Login */
#loginPage{
  flex:1;
  overflow-y:auto
}
.card{
  background:#fff;
  border-radius:15px;
  padding:17px;
  box-shadow:0 2px 10px rgba(0,0,0,.04)
}
.login-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:5px
}
.login-sub{
  font-size:13px;
  line-height:1.4;
  color:#777;
  margin-bottom:16px
}
label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:#374151;
  margin:12px 0 6px
}
input{
  width:100%;
  height:47px;
  border:1px solid #d8dce2;
  border-radius:10px;
  padding:0 12px;
  background:#fff;
  color:#111827;
  font-size:16px;
  outline:none
}
input:focus{
  border-color:#111827
}
button{
  width:100%;
  height:47px;
  border-radius:10px;
  background:#111827;
  color:#fff;
  font-size:15px;
  font-weight:700;
  margin-top:17px
}
button:disabled{
  opacity:.55
}

/* Customer */
#customerPage{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden
}

/* Filter */
.customer-filter-row{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:4px;
  width:100%;
  margin-bottom:5px
}
.filter-box{
  flex:.85;
  min-width:0;
  height:34px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:8px;
  padding:0 5px;
  color:#111827;
  font-size:9px;
  font-weight:700;
  outline:none;
  box-shadow:0 2px 5px rgba(0,0,0,.05)
}
.customer-name-card{
  flex:1.25;
  min-width:0;
  height:34px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:8px;
  padding:3px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#111827;
  white-space:nowrap;
  overflow:hidden;
  box-shadow:0 2px 5px rgba(0,0,0,.05)
}
#customerNameText{
  width:100%;
  font-size:13px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis
}
#customerPhone{
  width:100%;
  margin-top:1px;
  color:#64748b;
  font-size:9px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis
}

/* Balance + Rate */
.balance-rate-row{
  flex-shrink:0;
  display:flex;
  align-items:center;
  width:100%;
  height:52px;
  margin-bottom:5px;
  padding:5px 7px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:11px;
  box-shadow:0 3px 8px rgba(0,0,0,.08)
}
.balance-box{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding-left:2px
}
.due-label{
  color:#dc2626;
  font-size:9px;
  line-height:1;
  margin-bottom:3px;
  font-weight:500
}

.due-number{
  color:#dc2626;
  font-size:18px;
  line-height:1;
  font-weight:800;
  letter-spacing:-.3px
}

.due-kd{
  color:#dc2626;
  font-size:8px;
  font-weight:600
}
.rate-box{
  flex:1;
  min-width:0;
  height:100%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:0;
  background:transparent;
  border:0;
  box-shadow:none
}
.rate-input{
  width:100%;
  max-width:155px;
  height:34px;
  border:1px solid #dbe4ee;
  border-radius:17px;
  font-size:10px;
  font-weight:600;
  padding:0 9px;
  margin:0;
  background:#f8fafc;
  color:#111827;
  outline:none;
  box-shadow:none
}
.rate-input::placeholder{
  color:#64748b;
  font-weight:500
}
.rate-input:focus{
  border-color:#93c5fd;
  background:#fff;
  box-shadow:0 0 0 3px rgba(147,197,253,.15)
}

/* Rate Popup */
.rate-popup{
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 6px);
  background:#111827;
  color:#fff;
  border-radius:10px;
  padding:7px 9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  opacity:0;
  visibility:hidden;
  transform:translateY(8px);
  transition:opacity .18s ease,transform .18s ease,visibility .18s ease;
  box-shadow:0 5px 16px rgba(0,0,0,.18);
  z-index:50
}
.rate-popup.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0)
}
.rate-popup-left{
  min-width:0
}
.rate-popup-label{
  color:#aeb8c7;
  font-size:8px;
  line-height:1;
  margin-bottom:2px
}
.rate-popup-amount{
  font-size:13px;
  font-weight:700;
  white-space:nowrap
}
.rate-popup-right{
  text-align:right;
  flex-shrink:0
}
.rate-popup-kd{
  font-size:17px;
  font-weight:800;
  line-height:1;
  white-space:nowrap
}
.rate-popup::after{
  content:"";
  position:absolute;
  right:25%;
  top:-5px;
  width:10px;
  height:10px;
  background:#111827;
  transform:rotate(45deg)
}

/* Notice */
.notice{
  flex-shrink:0;
  background:#fff9e9;
  border:1px solid #f3dfaa;
  border-radius:10px;
  padding:8px 10px;
  margin-bottom:8px
}
.notice-title{
  font-size:11px;
  font-weight:700;
  color:#5f4a10;
  margin-bottom:3px
}
.notice-text{
  font-size:12px;
  line-height:1.4;
  color:#625b46;
  white-space:pre-wrap
}

/* Transactions */
.transaction-history-title{
  flex-shrink:0;
  font-size:10px;
  font-weight:800;
  color:#64748b;
  margin:2px 0 3px
}
.transactions-scroll{
  flex:1;
  min-height:0;
  width:100%;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-bottom:2px
}
.transaction{
  position:relative;
  width:100%;
  background:#fff;
  border:1px solid #e9edf1;
  border-radius:9px;
  padding:9px 10px 8px;
  margin-bottom:3px;
  box-shadow:0 1px 2px rgba(0,0,0,.025)
}
.transaction-date{
  color:#64748b;
  font-size:9px;
  line-height:1.1;
  margin-bottom:2px;
  padding-right:55px
}
.transaction-type{
  position:absolute;
  top:6px;
  right:9px;
  color:#111827;
  font-size:11px;
  font-weight:800
}
.transaction-main{
  color:#111827;
  font-size:18px;
  line-height:1;
  font-weight:800
}
.transaction-kd{
  font-size:8px;
  font-weight:700
}
.transaction-note{
  color:#64748b;
  font-size:9px;
  line-height:1.15;
  margin-top:2px
}
.transaction.due-type{
  border-left:4px solid #111827
}
.transaction.paid-type{
  border-left:4px solid #ef4444;
  background:#fef2f2
}
.transaction.paid-type .transaction-main,
.transaction.paid-type .transaction-type{
  color:#dc2626
}

/* Message */
.message{
  width:100%;
  text-align:center;
  min-height:18px;
  margin-top:7px;
  font-size:11px
}
.error{
  color:#dc2626
}
.loading{
  color:#777
}

/* Footer */
.footer{
  flex-shrink:0;
  text-align:center;
  padding:6px 8px;
  color:#9ca3af;
  font-size:9px
}

/* Small Phone */
@media(max-width:360px){
  .header{padding:11px 10px}
  .header-title{font-size:16px}
  .header-sub{font-size:9px}
  .header-actions{gap:4px}
  .header-button{
    height:29px;
    padding:0 7px;
    font-size:9px
  }
  .container{padding:8px}

  .customer-filter-row{
    gap:3px;
    margin-bottom:5px
  }
  .filter-box{
    height:34px;
    padding:0 3px;
    font-size:8px;
    border-radius:8px
  }
  .filter-box option{
    font-size:9px
  }
  .customer-name-card{
    height:34px;
    padding:3px 4px;
    border-radius:8px
  }
  #customerNameText{
    font-size:12px
  }
  #customerPhone{
    font-size:8px
  }

  .balance-rate-row{
    height:49px;
    padding:4px;
    border-radius:10px
  }
  .balance-box{
    padding-left:5px
  }
  .due-label{font-size:7px}
  .due-number{font-size:16px}
  .due-kd{font-size:6px}

  .rate-box{
    height:39px;
    padding:0
  }
  .rate-input{
    height:31px;
    font-size:9px;
    padding:0 5px
  }

  .rate-popup{padding:6px 8px}
  .rate-popup-amount{font-size:12px}
  .rate-popup-kd{font-size:16px}

  .notice{
    padding:7px 9px;
    margin-bottom:7px
  }
  .notice-title{font-size:10px}
  .notice-text{font-size:10px}

  .transaction{
    padding:8px 9px 7px;
    margin-bottom:3px
  }
  .transaction-main{font-size:15px}
  .footer{padding:5px 8px}
}

/* Extra Small */
@media(max-width:330px){
  .header-title{font-size:15px}
  .header-sub{font-size:8px}
  .header-button{
    padding:0 6px;
    font-size:8px
  }
  .customer-name-card{font-size:9px}
  .filter-box{
    font-size:8px;
    padding:0 3px
  }
  .rate-input{
    font-size:9px;
    padding:0 5px
  }
}
</style>
</head>

<body>

<div class="app">

<!-- Header -->
<div class="header">
  <div class="header-row">

    <div class="header-left">
      <div class="header-title">Amaya Exchange</div>
      <div class="header-sub">লেনদেনে আস্থা, সেবায় নির্ভরতা</div>
    </div>

    <div class="header-actions">
      <button
        class="header-button contact-button"
        onclick="contactWhatsApp()"
      >📞 Contact Us</button>

      <button
        id="headerLogout"
        class="header-button header-logout hidden"
        onclick="logout()"
      >Logout</button>
    </div>

  </div>
</div>

<!-- Login -->
<div id="loginPage" class="container">

  <div class="card">

    <div class="login-title">Customer Login</div>

    <div class="login-sub">
      আপনার WhatsApp Number এবং Password দিয়ে Login করুন
    </div>

    <label>WhatsApp Number</label>
    <input
      id="phone"
      type="tel"
      inputmode="tel"
      placeholder="WhatsApp Number"
      autocomplete="username"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton" onclick="login()">Login</button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>

<!-- Customer -->
<div id="customerPage" class="container hidden">

  <!-- Filter -->
  <div class="customer-filter-row">

    <select
      id="yearFilter"
      class="filter-box"
      onchange="applyTransactionFilter()"
    ></select>

    <select
      id="monthFilter"
      class="filter-box"
      onchange="applyTransactionFilter()"
    >
      <option value="all">All Transaction</option>
      <option value="0">January</option>
      <option value="1">February</option>
      <option value="2">March</option>
      <option value="3">April</option>
      <option value="4">May</option>
      <option value="5">June</option>
      <option value="6">July</option>
      <option value="7">August</option>
      <option value="8">September</option>
      <option value="9">October</option>
      <option value="10">November</option>
      <option value="11">December</option>
    </select>

    <div id="customerName" class="customer-name-card">
      <div id="customerNameText"></div>
      <div id="customerPhone"></div>
    </div>

  </div>

  <!-- Balance + Rate -->
  <div class="balance-rate-row">

    <div class="balance-box">

      <div class="due-label">আপনার বর্তমান বাকি</div>

      <div class="due-number">
        <span id="currentDue">0.000</span>
        <span class="due-kd">KD</span>
      </div>

    </div>

    <div class="rate-box">

      <div id="ratePopup" class="rate-popup">

        <div class="rate-popup-left">
          <div class="rate-popup-label">Amount</div>
          <div id="ratePopupAmount" class="rate-popup-amount">0 Tk</div>
        </div>

        <div class="rate-popup-right">
          <div id="ratePopupKD" class="rate-popup-kd">0.000 KD</div>
        </div>

      </div>

      <input
        id="rateAmount"
        class="rate-input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="💱 রেট জানতে টাকা লিখুন"
        oninput="calculateRate()"
      >

    </div>

  </div>

  <!-- Notice -->
  <div id="noticeBox" class="notice hidden">

    <div class="notice-title">📢 Notice</div>

    <div id="noticeText" class="notice-text"></div>

  </div>

  <!-- Transactions -->
  <div class="transaction-history-title">
    Transaction History
  </div>

  <div id="transactions" class="transactions-scroll"></div>

</div>

<!-- Footer -->
<div class="footer">
  Amaya Exchange
</div>

</div>

<script>

// Config
const API_URL="https://script.google.com/macros/s/AKfycbxv9Y6u320GLBP6Axvzdb8eZpKSkB25Xjbt1656GL-tj5AHuJWjVvdVfp5qRZSu8lfs/exec";

const CONTACT_WHATSAPP="8801354304315";

const RATE_1=333.333333,
      RATE_2=363.636363,
      RATE_3=357.142857,
      REFRESH_TIME=5000;


// State
let currentCustomer=null;
let refreshTimer=null;
let loadingTransactions=false;
let lastTransactionId="";
let allTransactions=[];


// DOM
const $=id=>document.getElementById(id);

const loginPage=$("loginPage");
const customerPage=$("customerPage");

const phoneInput=$("phone");
const passwordInput=$("password");

const loginButton=$("loginButton");
const loginMessage=$("loginMessage");

const customerNameText=$("customerNameText");
const customerPhone=$("customerPhone");

const noticeBox=$("noticeBox");
const noticeText=$("noticeText");

const currentDue=$("currentDue");
const transactionsBox=$("transactions");

const rateAmount=$("rateAmount");
const ratePopup=$("ratePopup");
const ratePopupAmount=$("ratePopupAmount");
const ratePopupKD=$("ratePopupKD");

const yearFilter=$("yearFilter");
const monthFilter=$("monthFilter");

const headerLogout=$("headerLogout");


// Contact
function contactWhatsApp(){
  window.open(
    "https://wa.me/"+CONTACT_WHATSAPP,
    "_blank"
  );
}


// Number
function convertBanglaNumbers(value){

  const bn="০১২৩৪৫৬৭৮৯";
  const en="0123456789";

  return String(value).replace(
    /[০-৯]/g,
    d=>en[bn.indexOf(d)]
  );
}

function formatAmount(number){
  return Number(number).toLocaleString("en-IN");
}


// Rate
function calculateRate(){

  let value=convertBanglaNumbers(rateAmount.value)
    .replace(/[^0-9]/g,"");

  if(!value){
    ratePopup.classList.remove("show");
    return;
  }

  const amount=parseInt(value,10);

  if(!Number.isFinite(amount)||amount<=0){
    ratePopup.classList.remove("show");
    return;
  }

  let rate;

  if(amount<1000){
    rate=RATE_1;
  }else if(amount%1000===0){
    rate=RATE_2;
  }else{
    rate=RATE_3;
  }

  const kd=amount/rate;

  rateAmount.value=formatAmount(amount);

  ratePopupAmount.textContent=
    formatAmount(amount)+" Tk";

  ratePopupKD.textContent=
    kd.toFixed(3)+" KD";

  ratePopup.classList.add("show");
}


// Login
async function login(){

  const phone=
    phoneInput.value.trim().replace(/\s+/g,"");

  const password=
    passwordInput.value.trim();

  if(!phone||!password){
    showMessage(
      "WhatsApp Number এবং Password দিন",
      "error"
    );
    return;
  }

  loginButton.disabled=true;
  loginButton.textContent="Login হচ্ছে...";

  try{

    const url=
      API_URL+
      "?action=customerLogin"+
      "&phone="+encodeURIComponent(phone)+
      "&password="+encodeURIComponent(password);

    const response=await fetch(url);
    const data=await response.json();

    if(data.success){

      currentCustomer=
        data.data?.customer||data.customer;

      if(!currentCustomer?.id){

        showMessage(
          "Customer তথ্য পাওয়া যায়নি",
          "error"
        );

        return;
      }

      localStorage.setItem(
        "customerSession",
        JSON.stringify(currentCustomer)
      );

      showCustomer();

    }else{

      showMessage(
        data.error||
        data.message||
        "Phone Number অথবা Password ভুল",
        "error"
      );
    }

  }catch(error){

    showMessage(
      "Server-এর সাথে যোগাযোগ করা যাচ্ছে না",
      "error"
    );

  }finally{

    loginButton.disabled=false;
    loginButton.textContent="Login";

  }
}


// Customer
function showCustomer(){

  loginPage.classList.add("hidden");
  customerPage.classList.remove("hidden");

  customerNameText.textContent=
    currentCustomer.name||"";

  customerPhone.textContent=
    currentCustomer.phone||"";

  headerLogout.classList.remove("hidden");

  loadNotice();
  loadTransactions(true);

  startAutoRefresh();
}


// Refresh
function startAutoRefresh(){

  stopAutoRefresh();

  refreshTimer=setInterval(()=>{

    if(
      currentCustomer&&
      !customerPage.classList.contains("hidden")
    ){
      loadTransactions(false);
    }

  },REFRESH_TIME);
}

function stopAutoRefresh(){

  if(refreshTimer){

    clearInterval(refreshTimer);
    refreshTimer=null;

  }
}


// Notice
async function loadNotice(){

  try{

    const response=await fetch(
      API_URL+"?action=notice",
      {cache:"no-store"}
    );

    const data=await response.json();

    const notice=
      data.data?.notice??data.notice;

    if(
      notice&&
      String(notice).trim()!==""
    ){

      noticeText.textContent=notice;
      noticeBox.classList.remove("hidden");

    }else{

      noticeBox.classList.add("hidden");

    }

  }catch(error){}

}


// Transactions
async function loadTransactions(firstLoad){

  if(!currentCustomer||loadingTransactions)return;

  loadingTransactions=true;

  if(firstLoad){

    transactionsBox.innerHTML=
      '<div class="message loading">লেনদেন লোড হচ্ছে...</div>';

  }

  try{

    const url=
      API_URL+
      "?action=transactions"+
      "&customerId="+
      encodeURIComponent(currentCustomer.id);

    const response=await fetch(
      url,
      {cache:"no-store"}
    );

    const data=await response.json();

    if(!data.success){

      if(firstLoad){

        transactionsBox.innerHTML=
          '<div class="message error">লেনদেন লোড হয়নি</div>';

      }

      return;
    }

    const result=data.data||{};

    const due=Number(result.currentDue||0);

    const dueText=due.toFixed(3);

    if(currentDue.textContent!==dueText){
      currentDue.textContent=dueText;
    }

    const transactions=
      result.transactions||[];

    allTransactions=
      Array.isArray(transactions)
      ?transactions
      :[];

    if(!allTransactions.length){

      if(firstLoad){

        transactionsBox.innerHTML=
          '<div class="message loading">কোনো লেনদেন পাওয়া যায়নি</div>';

      }

      return;
    }

    const latest=allTransactions[0];

    const latestId=
      latest.transactionId||
      (
        latest.date+
        "|"+
        latest.kdAmount+
        "|"+
        latest.type+
        "|"+
        latest.note
      );

    if(
      !firstLoad&&
      latestId===lastTransactionId
    )return;

    lastTransactionId=latestId;

    buildYearFilter(allTransactions);
    applyTransactionFilter();

  }catch(error){

    if(firstLoad){

      transactionsBox.innerHTML=
        '<div class="message error">লেনদেন লোড হয়নি</div>';

    }

  }finally{

    loadingTransactions=false;

  }
}


// Year Filter
function buildYearFilter(transactions){

  const years=new Set();

  transactions.forEach(t=>{

    const parsed=
      parseTransactionDate(t.date);

    if(parsed){
      years.add(parsed.getFullYear());
    }

  });

  const sortedYears=
    Array.from(years).sort((a,b)=>b-a);

  if(!sortedYears.length)return;

  const firstLoad=
    !yearFilter.dataset.initialized;

  const oldYear=
    yearFilter.value;

  const oldMonth=
    monthFilter.value;

  yearFilter.innerHTML="";

  sortedYears.forEach(year=>{

    const option=
      document.createElement("option");

    option.value=String(year);
    option.textContent=String(year);

    yearFilter.appendChild(option);

  });

  if(firstLoad){

    const currentYear=
      new Date().getFullYear();

    const currentMonth=
      new Date().getMonth();

    yearFilter.value=
      sortedYears.includes(currentYear)
      ?String(currentYear)
      :String(sortedYears[0]);

    monthFilter.value=
      String(currentMonth);

    yearFilter.dataset.initialized="true";

  }else{

    if(
      oldYear&&
      sortedYears.includes(Number(oldYear))
    ){
      yearFilter.value=oldYear;
    }

    if(oldMonth!==""){
      monthFilter.value=oldMonth;
    }

  }
}


// Date
function parseTransactionDate(value){

  if(!value)return null;

  const text=String(value).trim();

  const match=text.match(
    /^(\d{1,2})[-\/](Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[-\/](\d{4})$/i
  );

  if(match){

    const day=
      parseInt(match[1],10);

    const monthText=
      match[2].toLowerCase();

    const year=
      parseInt(match[3],10);

    const months=[
      "jan","feb","mar","apr","may","jun",
      "jul","aug","sep","oct","nov","dec"
    ];

    const month=
      months.indexOf(monthText);

    if(month>=0){

      return new Date(
        year,
        month,
        day
      );

    }
  }

  const fallback=
    new Date(text);

  return isNaN(fallback.getTime())
    ?null
    :fallback;
}


// Filter
function applyTransactionFilter(){

  if(!allTransactions.length){

    transactionsBox.innerHTML=
      '<div class="message loading">কোনো লেনদেন পাওয়া যায়নি</div>';

    return;
  }

  const selectedYear=
    Number(yearFilter.value);

  const selectedMonth=
    monthFilter.value;

  let filtered;

  if(selectedMonth==="all"){

    filtered=
      allTransactions.filter(t=>{

        const date=
          parseTransactionDate(t.date);

        return date&&
          date.getFullYear()===selectedYear;

      });

  }else{

    const month=
      Number(selectedMonth);

    filtered=
      allTransactions.filter(t=>{

        const date=
          parseTransactionDate(t.date);

        return date&&
          date.getFullYear()===selectedYear&&
          date.getMonth()===month;

      });

  }

  renderTransactions(filtered);
}


// Render
function renderTransactions(transactions){

  if(!transactions.length){

    transactionsBox.innerHTML=
      '<div class="message loading">এই সময়ে কোনো লেনদেন পাওয়া যায়নি</div>';

    return;
  }

  const fragment=
    document.createDocumentFragment();

  for(const t of transactions){

    const item=
      document.createElement("div");

    item.className=
      t.type==="বাকি"
      ?"transaction due-type"
      :"transaction paid-type";

    const sign=
      t.type==="বাকি"
      ?"+"
      :"−";

    let note=t.note||"";

    const bdAmount=t.bdAmount;

    if(
      bdAmount!==""&&
      bdAmount!==null&&
      bdAmount!==undefined&&
      Number(bdAmount)!==0
    ){

      const tk=
        Number(
          String(bdAmount)
            .replace(/,/g,"")
        ).toLocaleString("en-IN");

      note=
        note
        ?note+" • "+tk+" Tk"
        :tk+" Tk";
    }

    const kdAmount=
      Number(t.kdAmount||0);

    const noteHTML=
      note
      ?`<div class="transaction-note">${escapeHTML(note)}</div>`
      :"";

    item.innerHTML=
      `<div class="transaction-date">${escapeHTML(t.date)}</div>`+
      `<div class="transaction-type">${escapeHTML(t.type)}</div>`+
      `<div class="transaction-main">${sign}${kdAmount.toFixed(3)} <span class="transaction-kd">KD</span></div>`+
      noteHTML;

    fragment.appendChild(item);
  }

  transactionsBox.replaceChildren(fragment);
}


// Logout
function logout(){

  stopAutoRefresh();

  localStorage.removeItem(
    "customerSession"
  );

  currentCustomer=null;
  lastTransactionId="";
  allTransactions=[];

  customerPage.classList.add("hidden");
  loginPage.classList.remove("hidden");

  headerLogout.classList.add("hidden");

  phoneInput.value="";
  passwordInput.value="";
  rateAmount.value="";

  ratePopup.classList.remove("show");

  loginMessage.textContent="";
}


// Session
function checkSavedLogin(){

  const saved=
    localStorage.getItem("customerSession");

  if(!saved)return;

  try{

    currentCustomer=
      JSON.parse(saved);

    if(
      currentCustomer&&
      currentCustomer.id&&
      currentCustomer.name
    ){

      showCustomer();

    }

  }catch(error){

    localStorage.removeItem(
      "customerSession"
    );

  }
}


// Message
function showMessage(text,type){

  loginMessage.textContent=text;

  loginMessage.className=
    "message "+(type||"");
}


// Escape
function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// Start
checkSavedLogin();

</script>
